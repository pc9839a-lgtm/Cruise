name: Finalize SEO publish 2026-09-19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-publish-20260919.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch blog registry and discovery files
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          slug='singapore-departure-cruise-booking-guide'
          title='싱가포르 출발 크루즈 예약 가이드: 터미널·입국·전날 숙박까지'
          summary='싱가포르 출발 크루즈 예약 전 확인할 항로 선택, Marina Bay 크루즈 터미널, SG Arrival Card, 항공·전날 숙박과 총비용 비교 기준을 정리했습니다.'
          url=f'https://cruiseplay-dyt.pages.dev/blog/{slug}/'
          p=root/'content/blog-meta.json'; data=json.loads(p.read_text())
          if not any(x.get('slug')==slug for x in data['posts']):
              data['posts'].insert(0,{'slug':slug,'category':'출발항·예약','title':title,'summary':summary,'thumbnail_url':'https://cruiseplay-dyt.pages.dev/img/og-image.jpg','tag_text':'싱가포르출발크루즈,싱가포르크루즈,싱가포르크루즈터미널,SGArrivalCard','published_at':'2026-09-19','updated_at':'2026-09-19','sort_order':min(x.get('sort_order',0) for x in data['posts'])-1})
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=root/'blog/index.html'; s=p.read_text()
          card=f'''<article class="blog-card" data-category="출발항·예약" data-title="{title}" data-summary="{summary}" data-tags="싱가포르출발크루즈,싱가포르크루즈,싱가포르크루즈터미널,SGArrivalCard"><a href="/blog/{slug}/"><img src="/img/og-image.jpg" alt="싱가포르 출발 크루즈 예약과 터미널 준비 안내" width="1600" height="900" loading="eager" decoding="async" fetchpriority="high"><time>2026-09-19</time><h2>{title}</h2><p>{summary}</p></a></article>'''
          if f'/blog/{slug}/' not in s:
              s=s.replace('<div class="blog-grid" id="blogGrid">','<div class="blog-grid" id="blogGrid">'+card,1)
          s=re.sub(r'(<strong id="blogResultsCount">)64(</strong>)',r'\g<1>65\g<2>',s,1)
          p.write_text(s)
          p=root/'sitemap.xml'; s=p.read_text()
          if url not in s: s=s.replace('  <url><loc>https://cruiseplay-dyt.pages.dev/blog/</loc></url>\n','  <url><loc>https://cruiseplay-dyt.pages.dev/blog/</loc></url>\n  <url><loc>'+url+'</loc><lastmod>2026-09-19</lastmod></url>\n',1)
          p.write_text(s)
          item=f'<item><title>{title}</title><link>{url}</link><guid isPermaLink="true">{url}</guid><description>{summary}</description><category>출발항·예약</category><dc:creator>오케이크루즈 편집팀</dc:creator><pubDate>Sat, 19 Sep 2026 03:04:19 GMT</pubDate></item>\n'
          for fn in ['rss.xml','feed.xml']:
              p=root/fn; s=p.read_text(); s=re.sub(r'<lastBuildDate>.*?</lastBuildDate>','<lastBuildDate>Sat, 19 Sep 2026 03:04:19 GMT</lastBuildDate>',s,1)
              if url not in s: s=s.replace('/>\n<item>','/>\n'+item+'<item>',1)
              p.write_text(s)
          p=root/'functions/blog/_middleware.js'; s=p.read_text()
          block=f'''  {{\n    path: '/blog/{slug}/',\n    category: '출발항·예약',\n    title: '{title}',\n    summary: '{summary}',\n    tags: '싱가포르출발크루즈,싱가포르크루즈,싱가포르크루즈터미널,SGArrivalCard',\n    date: '2026-09-19',\n    alt: '싱가포르 출발 크루즈 예약과 터미널 준비 안내'\n  }},\n'''
          if f'/blog/{slug}/' not in s: s=s.replace('const LATEST_POSTS = [\n','const LATEST_POSTS = [\n'+block,1)
          p.write_text(s)
          pathlib.Path('.github/workflows/seo-publish-20260919.yml').unlink()
          PY
      - name: Commit finalized publish
        run: |
          git config user.name 'okaycruise-seo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'seo: register Singapore departure cruise guide' || exit 0
          git push origin main
