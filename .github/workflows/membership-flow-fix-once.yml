name: Membership canonical flow fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/membership-flow-fix-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor canonical CSS directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('membership/membership-canonical-v4.css')
          css = css_path.read_text(encoding='utf-8')

          css = css.replace('--m4-page:#edf1f6;', '--m4-page:#f5f7fb;')
          css = css.replace('--m4-gap:28px;', '--m4-gap:0px;')
          css = css.replace(
              'main#top{background:var(--m4-page)!important}',
              '''main#top{background:\n  radial-gradient(circle at 18% 28%,rgba(36,104,232,.045),transparent 24%),\n  radial-gradient(circle at 84% 66%,rgba(139,213,255,.05),transparent 25%),\n  linear-gradient(180deg,#fafbfd 0%,var(--m4-page) 48%,#f1f5f9 100%)!important}'''
          )
          css = css.replace('margin:var(--m4-gap) 0!important;', 'margin:0!important;', 1)
          css = css.replace('overflow:hidden!important;', 'overflow:visible!important;', 1)

          css = css.replace(
              ':is(#mx-moving-hotel,#mx-moving-hotel-4,#price-compare,#mx-cost-structure,#mx-prepare-money,#points-by-time,#real-cost,#calculator,#mx-fit-check,#m3-selector,#mx-final-choice,#plans){background:var(--m4-light)!important;color:var(--m4-ink)!important}',
              ':is(#mx-moving-hotel,#mx-moving-hotel-4,#price-compare,#mx-cost-structure,#mx-prepare-money,#points-by-time,#real-cost,#calculator,#mx-fit-check,#m3-selector,#mx-final-choice,#plans){background:transparent!important;color:var(--m4-ink)!important}'
          )
          css = css.replace(
              ':is(#mx-port-day,#impact-med,#price-pain,#same-cruise,#m3-savings-use,#guide-question,#membership-point,#mx-use-rules,#mx-plan-guide,#membership-terms){background:var(--m4-navy)!important;color:#fff!important}',
              ':is(#mx-port-day,#impact-med,#price-pain,#same-cruise,#m3-savings-use,#guide-question,#membership-point,#mx-use-rules,#mx-plan-guide,#membership-terms){background:transparent!important;color:#fff!important}'
          )

          css = css.replace('#mx-moving-hotel{background:#fff!important}', '#mx-moving-hotel{background:transparent!important}')
          css = css.replace('#mx-moving-hotel-4{background:#fff!important}', '#mx-moving-hotel-4{background:transparent!important}')
          css = css.replace('#impact-med{background:linear-gradient(145deg,#081426 0%,#10233f 100%)!important}', '#impact-med{background:transparent!important}')

          flow_block = r'''

/* continuous page flow — section backgrounds no longer cut the viewport */
:is(#mx-port-day,#impact-med,#price-pain,#same-cruise,#m3-savings-use,#guide-question,#membership-point,#mx-use-rules,#mx-plan-guide,#membership-terms){
  padding:26px 0!important;
}

#mx-port-day .mxp-inner,
#impact-med .impact-inner,
#price-pain .mv2-inner,
#same-cruise .mv2-inner,
#m3-savings-use .m3-inner,
#guide-question .mx11-inner,
#membership-point .mx13-inner,
#mx-use-rules .mx16-inner,
#mx-plan-guide .mx19-inner,
#membership-terms .mx21-inner{
  position:relative!important;
  width:min(1180px,calc(100% - 40px))!important;
  max-width:1180px!important;
  margin-inline:auto!important;
  padding:76px 56px!important;
  border:1px solid rgba(255,255,255,.10)!important;
  border-radius:36px!important;
  background:
    radial-gradient(circle at 82% 10%,rgba(133,210,255,.105),transparent 31%),
    linear-gradient(145deg,#07111f 0%,#102642 100%)!important;
  box-shadow:0 28px 78px rgba(7,17,31,.14)!important;
  overflow:hidden!important;
}

#impact-med .impact-inner,
#m3-savings-use .m3-inner{
  background:
    radial-gradient(circle at 18% 8%,rgba(47,115,255,.16),transparent 34%),
    radial-gradient(circle at 88% 88%,rgba(112,92,255,.10),transparent 30%),
    linear-gradient(145deg,#07111f 0%,#112947 100%)!important;
}

#impact-med{padding-bottom:9px!important}
#price-pain{padding-top:9px!important}
#m3-savings-use{padding-bottom:9px!important}
#guide-question{padding-top:9px!important}

#points-by-time,#real-cost,#calculator,#mx-fit-check{position:relative!important}
#points-by-time::before,#real-cost::before,#calculator::before,#mx-fit-check::before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:min(1040px,calc(100% - 80px));
  height:1px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(111,129,154,.18),transparent);
  pointer-events:none;
}
'''

          marker = '\n/* SECTION 2 */'
          if 'continuous page flow — section backgrounds no longer cut the viewport' not in css:
              css = css.replace(marker, flow_block + marker, 1)

          css = css.replace(
              ':root{--m4-gap:18px;--m4-y:72px;',
              ':root{--m4-gap:0px;--m4-y:72px;'
          )

          mobile_block = r'''
  :is(#mx-port-day,#impact-med,#price-pain,#same-cruise,#m3-savings-use,#guide-question,#membership-point,#mx-use-rules,#mx-plan-guide,#membership-terms){padding:16px 0!important}
  #mx-port-day .mxp-inner,#impact-med .impact-inner,#price-pain .mv2-inner,#same-cruise .mv2-inner,#m3-savings-use .m3-inner,#guide-question .mx11-inner,#membership-point .mx13-inner,#mx-use-rules .mx16-inner,#mx-plan-guide .mx19-inner,#membership-terms .mx21-inner{
    width:calc(100% - 24px)!important;
    max-width:none!important;
    padding:56px 20px!important;
    border-radius:26px!important;
    box-shadow:0 20px 48px rgba(7,17,31,.12)!important;
  }
  #impact-med{padding-bottom:5px!important}
  #price-pain{padding-top:5px!important}
  #m3-savings-use{padding-bottom:5px!important}
  #guide-question{padding-top:5px!important}
  #points-by-time::before,#real-cost::before,#calculator::before,#mx-fit-check::before{width:calc(100% - 48px)}
'''
          mobile_marker = '@media(max-width:820px){\n  :root{--m4-gap:0px;--m4-y:72px;'
          if mobile_marker in css and 'width:calc(100% - 24px)!important;' not in css:
              css = css.replace(mobile_marker, mobile_marker + mobile_block, 1)

          css_path.write_text(css, encoding='utf-8')

          middleware_path = Path('functions/membership/_middleware.js')
          middleware = middleware_path.read_text(encoding='utf-8')
          middleware = middleware.replace(
              '/membership/membership-canonical-v5.css?v=20260902-flow1',
              '/membership/membership-canonical-v4.css?v=20260902-flow2'
          )
          middleware = middleware.replace(
              '''    .on('link[href*="membership-canonical-v4.css"]', {\n      element(element) { element.remove(); }\n    })\n''',
              ''
          )
          middleware_path.write_text(middleware, encoding='utf-8')

          v5 = Path('membership/membership-canonical-v5.css')
          if v5.exists():
              v5.unlink()
          PY

      - name: Commit canonical refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add membership/membership-canonical-v4.css functions/membership/_middleware.js membership/membership-canonical-v5.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refactor membership section backgrounds into continuous flow"
          git push origin HEAD:main
