            <footer class="blog-footer"><div class="blog-container"><nav><a href="/about/">사이트 소개</a><a href="/editorial-policy/">편집 정책</a><a href="/privacy/">개인정보처리방침</a><a href="/terms/">이용약관</a><a href="/contact/">문의</a></nav></div></footer>
          </div>
          </body></html>'''
          article = re.sub(r'^          ', '', article, flags=re.M)
          (article_dir/'index.html').write_text(article, encoding='utf-8')

          new_post = {
              'slug': SLUG, 'category': CATEGORY, 'title': TITLE, 'summary': SUMMARY,
              'thumbnail_url': IMAGE,
              'tag_text': '크루즈분실물,선내분실물,하선후신고,여권분실',
              'published_at': TODAY, 'updated_at': TODAY,
              'sort_order': min([p.get('sort_order',0) for p in posts] or [0]) - 1
          }
          posts.insert(0, new_post)
          data['posts'] = posts
          meta_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          index_path = ROOT/'blog/index.html'
          index = index_path.read_text(encoding='utf-8')
          old_count = len(re.findall(r'class="blog-card"', index))
          if old_count != len(posts)-1:
              raise SystemExit(f'PREEXISTING_CARD_META_MISMATCH:{old_count}:{len(posts)-1}')
          card = f'''<article class="blog-card" data-category="{CATEGORY}"><a href="/blog/{SLUG}/"><img src="{html.escape(IMAGE, quote=True)}" alt="크루즈 여행 중 분실한 휴대전화와 귀중품 신고 방법 안내" width="1600" height="900" loading="eager" decoding="async" fetchpriority="high"><time>{TODAY}</time><h2>{TITLE}</h2><p>{SUMMARY}</p></a></article>'''
          marker = '<div class="blog-grid" id="blogGrid">'
          if marker not in index:
              raise SystemExit('BLOG_GRID_MARKER_NOT_FOUND')
          index = index.replace(marker, marker + card, 1)
          index = re.sub(r'(<strong id="blogResultsCount">)\d+(</strong>)', rf'\g<1>{len(posts)}\g<2>', index, count=1)
          index_path.write_text(index, encoding='utf-8')

          ns = {'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          ET.register_namespace('', ns['sm'])
          sm_path = ROOT/'sitemap.xml'
          tree = ET.parse(sm_path); root = tree.getroot()
          seen = set()
          for node in list(root):
              loc = node.find('{%s}loc' % ns['sm'])
              text = (loc.text or '').strip() if loc is not None else ''
              if '/partner' in text or not text or text in seen:
                  root.remove(node)
              else:
                  seen.add(text)
          node = ET.Element('{%s}url' % ns['sm'])
          ET.SubElement(node, '{%s}loc' % ns['sm']).text = URL
          ET.SubElement(node, '{%s}lastmod' % ns['sm']).text = TODAY
          ET.SubElement(node, '{%s}changefreq' % ns['sm']).text = 'monthly'
          ET.SubElement(node, '{%s}priority' % ns['sm']).text = '0.6'
          root.insert(2, node)
          tree.write(sm_path, encoding='utf-8', xml_declaration=True)

          (ROOT/'sitemap-google.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <sitemap><loc>https://cruiseplay-dyt.pages.dev/sitemap.xml</loc></sitemap>\n</sitemapindex>\n', encoding='utf-8')
          (ROOT/'robots.txt').write_text('User-agent: *\nAllow: /\nDisallow: /partner/\nSitemap: https://cruiseplay-dyt.pages.dev/sitemap.xml\n', encoding='utf-8')

          # Remove partner URLs from every remaining sitemap-like file.
          for rel in ['sitemap.txt','sitemap-2026.xml']:
              p = ROOT/rel
              if p.exists():
                  txt = p.read_text(encoding='utf-8')
                  if rel.endswith('.txt'):
                      lines = [x for x in txt.splitlines() if '/partner' not in x]
                      if URL not in lines: lines.insert(2 if len(lines)>1 else len(lines), URL)
                      p.write_text('\n'.join(lines).rstrip()+'\n', encoding='utf-8')
                  else:
                      try:
                          t=ET.parse(p); r=t.getroot()
                          for n in list(r):
                              l=n.find('{%s}loc' % ns['sm'])
                              if l is not None and '/partner' in (l.text or ''): r.remove(n)
                          if not any((n.find('{%s}loc' % ns['sm']) is not None and (n.find('{%s}loc' % ns['sm']).text or '')==URL) for n in r):
                              n=ET.Element('{%s}url' % ns['sm']); ET.SubElement(n,'{%s}loc'%ns['sm']).text=URL; ET.SubElement(n,'{%s}lastmod'%ns['sm']).text=TODAY; r.insert(0,n)
                          t.write(p, encoding='utf-8', xml_declaration=True)
                      except ET.ParseError:
                          raise SystemExit(f'INVALID_XML:{rel}')
          ps = ROOT/'partner-sitemap.xml'
          if ps.exists(): ps.unlink()

          headers_path = ROOT/'_headers'
          if headers_path.exists():
              hdr = headers_path.read_text(encoding='utf-8')
              hdr = re.sub(r'\n/partner-sitemap\.xml\n(?:  .*\n)+', '\n', hdr)
              if '/partner/*\n  X-Robots-Tag: noindex, nofollow' not in hdr:
                  hdr += '\n/partner/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n'
              headers_path.write_text(hdr, encoding='utf-8')

          def rss(posts20, self_url):
              items=[]
              for p in posts20:
                  u=f"https://cruiseplay-dyt.pages.dev/blog/{p['slug']}/"
                  dt=datetime.fromisoformat(p['published_at']).replace(tzinfo=timezone.utc)
                  items.append(f"<item><title>{html.escape(p['title'])}</title><link>{u}</link><guid isPermaLink=\"true\">{u}</guid><description>{html.escape(p['summary'])}</description><category>{html.escape(p['category'])}</category><dc:creator>크루즈플레이 편집팀</dc:creator><pubDate>{format_datetime(dt)}</pubDate></item>")
              build=format_datetime(datetime(2026,7,28,0,0,tzinfo=timezone.utc))
              return '<?xml version="1.0" encoding="UTF-8"?><rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom" xmlns:dc="http://purl.org/dc/elements/1.1/"><channel><title>크루즈플레이</title><link>https://cruiseplay-dyt.pages.dev/blog/</link><description>처음 크루즈를 준비하는 분을 위한 비용, 선실, 준비물, 기항지 정보 가이드.</description><language>ko-KR</language><lastBuildDate>'+build+'</lastBuildDate><atom:link href="'+self_url+'" rel="self" type="application/rss+xml"/>'+''.join(items)+'</channel></rss>'
          top20 = posts[:20]
          (ROOT/'rss.xml').write_text(rss(top20,'https://cruiseplay-dyt.pages.dev/rss.xml'), encoding='utf-8')
          (ROOT/'feed.xml').write_text(rss(top20,'https://cruiseplay-dyt.pages.dev/feed.xml'), encoding='utf-8')

          # Final validation before commit.
          final_meta = json.loads(meta_path.read_text(encoding='utf-8'))['posts']
          final_index = index_path.read_text(encoding='utf-8')
          card_count = len(re.findall(r'class="blog-card"', final_index))
          hrefs = re.findall(r'<article class="blog-card"[^>]*>\s*<a href="([^"]+)"', final_index)
          if card_count != len(final_meta) or len(hrefs) != len(final_meta):
              raise SystemExit(f'FINAL_CARD_META_MISMATCH:{card_count}:{len(hrefs)}:{len(final_meta)}')
          if len(hrefs) != len(set(hrefs)) or f'/blog/{SLUG}/' not in hrefs:
              raise SystemExit('DUPLICATE_OR_MISSING_STATIC_URL')
          art = (article_dir/'index.html').read_text(encoding='utf-8')
          for token in ['rel="canonical"','name="robots"','property="og:title"','"@type":"BlogPosting"','크루즈플레이 편집팀','게시일 2026.07.28','수정일 2026.07.28']:
              if token not in art: raise SystemExit('ARTICLE_SEO_VALIDATION_FAILED:'+token)
          for internal in ['cruise-passport-documents-check','cruise-travel-insurance-guide','cruise-onboard-payment-guide','cruise-disembarkation-flight-time-guide']:
              if not (ROOT/'blog'/internal/'index.html').exists(): raise SystemExit('MISSING_INTERNAL_LINK:'+internal)
          sitemap_text = sm_path.read_text(encoding='utf-8')
          if sitemap_text.count(URL) != 1 or '/partner/' in sitemap_text:
              raise SystemExit('SITEMAP_VALIDATION_FAILED')
          if '/partner/' in (ROOT/'sitemap-google.xml').read_text(encoding='utf-8'):
              raise SystemExit('GOOGLE_SITEMAP_PARTNER_FOUND')
          for rel in ['rss.xml','feed.xml']:
              txt=(ROOT/rel).read_text(encoding='utf-8')
              if txt.count('<item>') != 20 or txt.count(URL) != 3:
                  raise SystemExit('RSS_VALIDATION_FAILED:'+rel)
          print(json.dumps({'title':TITLE,'url':URL,'cards':card_count,'meta':len(final_meta),'rss_items':20}, ensure_ascii=False))
