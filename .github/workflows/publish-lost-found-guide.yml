              <section class="article-sources"><h2>공식 자료 확인</h2><p>아래 자료를 2026년 7월 28일 확인했습니다. 선사 정책과 접수 경로는 변경될 수 있으므로 실제 신고 시 공식 페이지에서 다시 확인하세요.</p><ul>
                <li><a href="https://www.royalcaribbean.com/gbr/en/faq/questions/lost-forgot-item-onboard" rel="noopener noreferrer">Royal Caribbean — How do I track down a lost or left behind item?</a></li>
                <li><a href="https://www.royalcaribbean.com/aus/en/faq/questions/lost-forgot-item-onboard" rel="noopener noreferrer">Royal Caribbean — Lost item return and shipping restrictions</a></li>
                <li><a href="https://www.ncl.com/ca/en/about/contact-us" rel="noopener noreferrer">Norwegian Cruise Line — Lost &amp; Found</a></li>
                <li><a href="https://help.carnival.com/app/answers/detail/a_id/2563/~/lost-and-found-%28missing-items%29" rel="noopener noreferrer">Carnival Cruise Line — Lost and Found (Missing Items)</a></li>
                <li><a href="https://www.passport.go.kr/home/kor/contents.do?menuPos=9" rel="noopener noreferrer">외교부 여권안내 — 여권 훼손·분실에 따른 재발급</a></li>
