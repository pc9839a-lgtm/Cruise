name: Verify new primary-sourced Cruise editorial content
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-editorial-batch-live.yml
      - blog/cruise-laundry-guide/index.html
      - blog/cruise-smoking-policy-guide/index.html
      - blog/cruise-cabin-outlet-charging-guide/index.html
      - blog/cruise-with-kids-family-guide/index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm four live Cruise guides show actual official evidence and tables
        shell: bash
        run: |
          python - <<'PY'
          import time, urllib.request, urllib.error
          base='https://cruiseplay-dyt.pages.dev/blog/'
          checks={
            'cruise-laundry-guide': ['로얄캐리비안 공식 사례','onboard-laundry-guest-services','34.99','class="post-table"'],
            'cruise-smoking-policy-guide': ['실제 규정·위반 비용','onboard-smoking-policy','250','class="post-table"'],
            'cruise-cabin-outlet-charging-guide': ['멀티탭을 가져가도 될까요','can-i-bring-an-extension-onboard','class="post-table"'],
            'cruise-with-kids-family-guide': ['승선 가능 여부가 달라지는 항로','international-age-policy','baby-toddler-accommodations-onboard','class="post-table"'],
          }
          pending={base+key+'/':values for key,values in checks.items()}
          for attempt in range(1,13):
            print('LIVE ROUND',attempt,flush=True)
            for url,needles in list(pending.items()):
              try:
                req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 (compatible; EditorialValueVerify/1.0)',
                  'Cache-Control':'no-cache'
                })
                with urllib.request.urlopen(req,timeout=20) as response:
                  body=response.read(2000000).decode('utf-8','replace')
                  status=response.status
                  ctype=response.headers.get('Content-Type','')
                missing=[v for v in needles if v not in body]
                print(url,'status',status,'type',ctype,'missing',missing,flush=True)
                if status==200 and 'text/html' in ctype and not missing:
                  del pending[url]
              except Exception as exc:
                print('RETRY',url,str(exc)[:140],flush=True)
            if not pending:break
            if attempt<12:time.sleep(12)
          if pending:
            raise SystemExit('FAIL missing live editorial evidence at: '+', '.join(pending))
          print('PASS all four real public Cruise pages show primary sources and rendered comparison tables')
          PY
