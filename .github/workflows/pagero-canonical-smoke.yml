name: Pagero canonical cross-site smoke
on:
  push:
    branches: [main]
    paths: [.github/workflows/pagero-canonical-smoke.yml]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify LIFE redirect does not loop and content is indexable
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,sys
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args):return None
          opener=urllib.request.build_opener(NoRedirect)
          checks={'https://pagero.kr/life/':'생활비서','https://pagero.kr/life/car/car-inspection-period/':'자동차'}
          for url,needle in checks.items():
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as resp:
                body=resp.read(250000).decode('utf-8','replace')
                status=resp.status
              passed=status==200 and needle in body
              print('CANONICAL',url,status,'body',needle in body,'valid',passed,flush=True)
              if not passed:sys.exit(1)
            except Exception as e:sys.exit(f'ERROR {url}: {e}')
          old='https://life.pagero.kr/car/car-inspection-period/'
          try:
            with opener.open(old,timeout=20) as resp:
              status=resp.status;loc=resp.headers.get('Location','')
          except urllib.error.HTTPError as e:
            status=e.code;loc=e.headers.get('Location','')
          print('OLD URL',status,loc,flush=True)
          if status!=301 or loc!='https://pagero.kr/life/car/car-inspection-period/':
            sys.exit('Old domain still not canonical')
          print('OK: no redirect loop, canonical LIFE pages usable and old host 301',flush=True)
          PY
