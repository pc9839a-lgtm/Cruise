name: Search and AdSense Integrity

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'sitemap-google.xml'
      - 'sitemap.txt'
      - 'robots.txt'
      - 'ads.txt'
      - '_headers'
      - '_routes.json'
      - 'functions/_middleware.js'
      - 'blog/**/index.html'
      - 'blog/templates/**'
      - 'membership/index.html'
      - 'partner/**/index.html'
      - 'academy/**/index.html'
      - 'about/index.html'
      - 'contact/index.html'
      - 'privacy/index.html'
      - 'terms/index.html'
      - 'scripts/validate_sitemaps.py'
      - 'scripts/validate_adsense_readiness.py'
      - '.github/workflows/sitemap-integrity.yml'
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'sitemap-google.xml'
      - 'sitemap.txt'
      - 'robots.txt'
      - 'ads.txt'
      - '_headers'
      - '_routes.json'
      - 'functions/_middleware.js'
      - 'blog/**/index.html'
      - 'blog/templates/**'
      - 'membership/index.html'
      - 'partner/**/index.html'
      - 'academy/**/index.html'
      - 'about/index.html'
      - 'contact/index.html'
      - 'privacy/index.html'
      - 'terms/index.html'
      - 'scripts/validate_sitemaps.py'
      - 'scripts/validate_adsense_readiness.py'
      - '.github/workflows/sitemap-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sitemap files
        run: python scripts/validate_sitemaps.py
      - name: Validate AdSense readiness
        run: python scripts/validate_adsense_readiness.py
