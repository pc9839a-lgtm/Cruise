name: Membership layout diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "membership/**"
      - "functions/membership/**"
      - ".github/workflows/membership-layout-diagnostics.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Inspect live mobile and desktop layouts
        env:
          SITE: https://cruiseplay-dyt.pages.dev/membership/
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args:['--no-sandbox'] });
            for (const width of [320, 375, 390, 1440]) {
              const context = await browser.newContext({viewport:{width,height:850},deviceScaleFactor:1});
              const page = await context.newPage();
              const errors=[];
              page.on('pageerror', err => errors.push(err.message.slice(0,240)));
              page.on('console', msg => { if(msg.type()==='error')errors.push(msg.text().slice(0,240)); });
              try {
                const response = await page.goto(process.env.SITE+'?audit='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:55000});
                await page.waitForTimeout(6500);
                const diagnostic = await page.evaluate(() => {
                  const selectors = ['#cms-survey-v2','.hero-section','.review-flow-section',
                    '#mx-port-day','#mx-direct-booking-intro','#mx-point-example','#mx-actual-cash',
                    '#calculator','#price-pain','#mx-member-booking-benefits','#mx-travel-expansion',
                    '#mx-membership-freedom','#plans','#planCards','#membership-terms',
                    '.membership-bottom-cta'];
                  const rect = el => {
                    if(!el)return null;
                    const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                    return {x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),
                      height:Math.round(r.height),display:s.display,opacity:s.opacity,
                      visibility:s.visibility,overflowX:s.overflowX,fontSize:s.fontSize,
                      background:s.backgroundColor};
                  };
                  const locations=Object.fromEntries(selectors.map(x=>[x,rect(document.querySelector(x))]));
                  const elems=[...document.querySelectorAll('body *')];
                  const overflow=elems.filter(e=>{
                    if(e.closest('#cms-survey-v2')) return false;
                    const s=getComputedStyle(e);
                    if(s.display==='none'||s.visibility==='hidden'||s.position==='fixed')return false;
                    const r=e.getBoundingClientRect();
                    return r.width>0&&(r.right>innerWidth+4||r.left< -4);
                  }).slice(0,25).map(e=>({tag:e.tagName,id:e.id,cls:typeof e.className==='string'?e.className.slice(0,120):'',
                    x:Math.round(e.getBoundingClientRect().x),w:Math.round(e.getBoundingClientRect().width)}));
                  return {window:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                    horizontalOverflow:document.documentElement.scrollWidth>innerWidth+2,
                    bodyChildren:document.body.children.length,sections:[...document.querySelectorAll('main section')].map(x=>x.id),
                    surveyVisible:!!document.querySelector('#cms-survey-v2')&&getComputedStyle(document.querySelector('#cms-survey-v2')).display!=='none',
                    locations,overflow,
                    membershipCards:document.querySelectorAll('#planCards .plan-card').length,
                    benefitCards:document.querySelectorAll('#mx-member-booking-benefits .mx18-benefit-card').length,
                    refundParent:document.querySelector('#mx-membership-freedom')?.parentElement?.className??null,
                    stylesheetCount:[...document.styleSheets].filter(x=>x.href?.includes('membership')).length};
                });
                const extended = await page.evaluate(() => {
                  const sections=[...document.querySelectorAll('main > section')].map((s,i)=>{
                    const r=s.getBoundingClientRect(),h=s.querySelector('h1,h2');
                    const hr=h?.getBoundingClientRect();
                    return {i:i+1,id:s.id,h:Math.round(r.height),
                      top:Math.round(r.top+scrollY),title:h?.innerText?.slice(0,60),
                      titleSize:h?getComputedStyle(h).fontSize:null,
                      titleOffscreen:!!hr&&(hr.x < -3 || hr.right>innerWidth+3)};
                  });
                  const textOverflow=[...document.querySelectorAll('main h1,main h2,main h3,main p,main strong')]
                    .filter(e=>{const s=getComputedStyle(e);
                      return s.display!=='none' && s.visibility!=='hidden' &&
                        e.getBoundingClientRect().height>0 &&
                        e.scrollWidth>e.clientWidth+4;})
                    .slice(0,25).map(e=>({tag:e.tagName,text:e.innerText?.slice(0,42),
                        cl:String(e.className).slice(0,60),scroll:e.scrollWidth,client:e.clientWidth}));
                  const brokenImages=[...document.images].filter(e=>e.complete&&e.naturalWidth===0)
                    .slice(0,12).map(e=>({src:e.getAttribute('src'),alt:e.alt}));
                  const menu=[...document.querySelectorAll('.hero-nav-track>a')].map(e=>e.getAttribute('href'));
                  const cardDims=selector=>[...document.querySelectorAll(selector)]
                    .map(e=>{const r=e.getBoundingClientRect();
                      return {w:Math.round(r.width),h:Math.round(r.height),opacity:getComputedStyle(e).opacity};});
                  return {pageHeight:document.documentElement.scrollHeight,sections,
                    firstPlanHeading:document.querySelector('#plans h2')?.innerText?.trim()?.slice(0,90),
                    reassuranceAfterPlans:document.querySelector('#planCards')?.nextElementSibling?.id==='mx-membership-freedom',
                    textOverflow,brokenImages,menuLinks:menu.length,menuUnique:new Set(menu).size,
                    prices:[...document.querySelectorAll('#price-pain .mx6-price-amount')].map(e=>e.textContent),
                    plans:cardDims('#planCards .plan-card'),
                    benefits:cardDims('#mx-member-booking-benefits .mx18-benefit-card'),
                    refunds:cardDims('#mx-membership-freedom .mxf-card'),
                    terms:cardDims('#membership-terms .mx21-term-card')};
                });
                const controls = await page.evaluate(() => {
                  const input=document.getElementById('cruisePrice');
                  const standard=document.querySelector('.mode-btn[data-mode="general"]');
                  const advance=document.querySelector('.mode-btn[data-mode="early"]');
                  const value=id=>document.getElementById(id)?.textContent.trim();
                  if(!input||!standard||!advance)return {error:'calculator controls missing'};
                  const before=input.value;
                  input.value='4000';
                  input.dispatchEvent(new Event('input',{bubbles:true}));
                  standard.click();
                  const regular={points:value('usablePoint'),card:value('cashUsd'),total:value('coverageRatio'),
                    selected:standard.getAttribute('aria-pressed')};
                  advance.click();
                  const early={points:value('usablePoint'),card:value('cashUsd'),total:value('coverageRatio'),
                    selected:advance.getAttribute('aria-pressed')};
                  input.value=before;
                  input.dispatchEvent(new Event('input',{bubbles:true}));
                  standard.click();
                  return {regular,early,
                    regularOk:regular.points==='2,000P'&&regular.card==='$2,000'&&regular.total==='$3,000'&&regular.selected==='true',
                    earlyOk:early.points==='6,000P'&&early.card==='$0'&&early.total==='$3,000'&&early.selected==='true'};
                });
                console.log('MEMBERSHIP_DEEP_AUDIT '+JSON.stringify({width,extended,controls}));
                const compact = await page.evaluate(() => {
                  const ids=[...document.querySelectorAll('main > section')].map(el => el.id || (el.classList.contains('hero-section')?'hero':'review'));
                  const expected=['hero','review','mx-moving-hotel','price-pain',
                    'mx-direct-booking-intro','same-cruise','guide-question',
                    'mx-cruise-price-examples','mx-lowest-price','membership-point',
                    'mx-booking-proof','calculator','plans','membership-terms'];
                  const note=document.querySelector('#plans .membership-plan-notice');
                  const receipt=document.querySelector('#same-cruise .mx8-cash-recap');
                  return {sectionCount:ids.length,expectedCount:expected.length,
                    actualIds:ids,missing:expected.filter(id=>!ids.includes(id)),
                    extra:ids.filter(id=>!expected.includes(id)),
                    cashRecap:receipt?.textContent?.includes('$3,020.88')||false,
                    planNotice:!!note&&note.textContent.includes('14일'),
                    planChoicesFirst:document.querySelector('#plans .membership-section-head')?.compareDocumentPosition(document.querySelector('#planCards'))===4};
                });
                console.log('MEMBERSHIP_COMPACT_AUDIT '+JSON.stringify({width,compact}));

                const surveyScript = await page.locator('script[src*="membership-entry-survey-v2.js"]').first().getAttribute('src').catch(() => null);
                const liveScriptText = await page.evaluate(async () => {
                  const script = document.querySelector('script[src*="membership-entry-survey-v2.js"]');
                  if (!script) return '';
                  try { return await (await fetch(script.src, {cache:'no-store'})).text(); } catch(e) { return ''; }
                });
                const cssBundle = await page.evaluate(async () => {
                  const el=document.querySelector('link[href*="membership-unified.css"]');
                  const url=el?.href||null;
                  if(!url)return {url:null};
                  try {
                    const resp=await fetch(url,{cache:'no-store'});
                    const code=await resp.text();
                    return {url,status:resp.status,length:code.length,
                      canonicalOwnerPresent:code.includes('06 — PRICE BRIDGE: canonical responsive styles'),
                      previousOwnerPresent:code.includes('06 — PRICE BRIDGE */')};
                  } catch(e) {return {url,error:String(e)};}
                });
                const priceLayout = await page.evaluate(() => {
                  const section=document.querySelector('#price-pain');
                  if(!section) return null;
                  const inner=section.querySelector('.mv2-inner'),title=section.querySelector('h2');
                  const amount=section.querySelector('.mx6-price-amount'),description=section.querySelector('.mv2-save');
                  const sectionRect=section.getBoundingClientRect();
                  const measure=(el)=>{
                    if(!el)return null;
                    const box=el.getBoundingClientRect(),style=getComputedStyle(el);
                    return {x:Math.round(box.x),y:Math.round(box.y),
                      w:Math.round(box.width),h:Math.round(box.height),
                      font:style.fontSize,align:style.textAlign,
                      scrollW:el.scrollWidth,clientW:el.clientWidth,
                      overflow:el.scrollWidth>el.clientWidth+2,
                      insideViewport:box.left>=-2&&box.right<=innerWidth+2};
                  };
                  return {section:measure(section),inner:measure(inner),
                    title:measure(title),amount:measure(amount),description:measure(description),
                    topPadding:getComputedStyle(section).paddingTop,
                    bottomPadding:getComputedStyle(section).paddingBottom,
                    minHeight:getComputedStyle(section).minHeight,
                    childContentHeight:description?.getBoundingClientRect().bottom-title?.getBoundingClientRect().top,
                    styleTagPresent:!!document.getElementById('membership-stage-1-4-style')};
                });
                console.log('MEMBERSHIP_LAYOUT_DIAGNOSTIC '+JSON.stringify({width,httpStatus:response.status(),errors,
                  liveScript:surveyScript,liveCodeUpdated:liveScriptText.includes("window.location.hash !== '#survey'"),
                  cssBundle,priceLayout,diagnostic}));
                if(await page.locator('#price-pain').count()){
                  await page.locator('#price-pain').scrollIntoViewIfNeeded({timeout:5000});
                  await page.waitForTimeout(300);
                  const priceImage=await page.locator('#price-pain').screenshot({type:'jpeg',quality:68,
                    path:'membership-'+width+'-price.jpg',timeout:25000});
                  if(width===390||width===1440)
                    console.log('MEMBERSHIP_PRICE_IMAGE_'+width+' '+priceImage.toString('base64'));
                }
                if(width===390||width===1440){
                  await page.screenshot({path:'membership-'+width+'-top.png',timeout:25000});
                  if(width===390) {
                    const jpeg = await page.screenshot({type:'jpeg',quality:48,timeout:25000});
                    console.log('MEMBERSHIP_IMAGE_390_TOP '+jpeg.toString('base64'));
                  }
                  for(const [label,selector] of [['receipt','#same-cruise'],['point','#membership-point'],['proof','#mx-booking-proof'],['calculator','#calculator'],['plans','#planCards'],['terms','#membership-terms']]){
                    const el=page.locator(selector).first();
                    if(await el.count()) {
                      await el.scrollIntoViewIfNeeded({timeout:5000}).catch(()=>{});
                      await page.waitForTimeout(350);
                      await page.screenshot({path:'membership-'+width+'-'+label+'.png',timeout:25000}).catch(()=>{});
                      if(width===390) {
                        const jpg=await el.screenshot({type:'jpeg',quality:50,timeout:25000});
                        console.log('MEMBERSHIP_IMAGE_390_'+label.toUpperCase()+' '+jpg.toString('base64'));
                      }
                    }
                  }
                }
              } catch(e) {
                console.log('MEMBERSHIP_LAYOUT_ERROR '+JSON.stringify({width,error:String(e),errors}));
              }
              await context.close();
            }
            await browser.close();
          })().catch(err => {console.error(err);process.exitCode=1});
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-layout-screenshots
          path: membership-*.png
          if-no-files-found: ignore
