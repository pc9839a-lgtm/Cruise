name: Membership layout diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'membership/**'
      - 'functions/membership/_middleware.js'
      - 'functions/_middleware.js'
      - 'assets/js/security-guard.js'
      - 'scripts/test_membership_contact_cooldown.mjs'
      - '.github/workflows/membership-layout-diagnostics.yml'
  pull_request:
    paths:
      - 'membership/**'
      - 'functions/membership/_middleware.js'
      - 'functions/_middleware.js'
      - 'assets/js/security-guard.js'
      - '.github/workflows/membership-layout-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax and contact throttling
        run: |
          node --check membership/cruise-membership-rebuild-v3.js
          node --check functions/membership/_middleware.js
          node --check functions/_middleware.js
          node --check functions/api/contact.js
          node scripts/test_membership_contact_cooldown.mjs
      - name: Verify concise value-first content and retained form
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html=fs.readFileSync('membership/index.html','utf8');
          const css=fs.readFileSync('membership/membership-unified.css','utf8');
          const edge=fs.readFileSync('functions/membership/_middleware.js','utf8');
          for(const id of ['membership-point','member-example','member-proof','calculator','plans','membership-inquiry','memberSavings','membershipInquiryForm','memberAgentCode']) {
            assert.ok(html.includes('id="'+id+'"'),'Missing value section/control: '+id);
          }
          for(const piece of ['가입 전에 조건부터 확인하고 싶다면','약정 없음','위약금 없음','14일 이내 환불','크루즈 외 호텔·투어도','membership-terms','member-plan-consult','membership-plan-notice']) {
            assert.ok(!html.includes(piece),'Unwanted marketing or terms duplicated: '+piece);
          }
          assert.ok(html.includes('$2,000 크루즈라면?'));
          assert.ok(html.includes('누적 지출 $1,600'));
          assert.ok(html.includes('name="interest_schedule_id" value="membership_inquiry"'));
          assert.ok(html.includes('action="/api/contact"'));
          assert.ok(html.includes('id="membershipPrivacyInput"'));
          assert.ok(html.includes('href="/terms/"'));
          assert.ok(!edge.includes('membership-section')&&!edge.includes('membership-scaffold'));
          assert.ok(css.length<40000,'Layered CSS unexpectedly restored');
          assert.ok(!css.includes('#membership-terms'),'Redundant terms CSS restored');
          assert.equal((html.match(/<section\b/g)||[]).length,8,'Unexpected section bloat');
          console.log('MEMBERSHIP_STATIC_PASS',JSON.stringify({sections:8,cssBytes:css.length}));
          NODE
      - name: Install Playwright
        if: github.event_name != 'pull_request'
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Inspect latest live mobile and PC page
        if: github.event_name != 'pull_request'
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const {mkdirSync}=require('fs');
          const assert=require('node:assert/strict');
          const site='https://cruiseplay-dyt.pages.dev/membership/';
          const requiredVersion='20261118-value1';
          mkdirSync('membership-diagnostics',{recursive:true});
          const nap=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for(const width of [320,375,390,1440]){
                const page=await browser.newPage({viewport:{width,height:850},deviceScaleFactor:1});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                let current=false,status=0;
                for(let attempt=0;attempt<20;attempt++){
                  const response=await page.goto(site+'?audit='+process.env.GITHUB_SHA+'-'+attempt,{
                    waitUntil:'domcontentloaded',timeout:55000
                  });
                  status=response?.status()||0;
                  const live=await page.locator('script[src*="cruise-membership-rebuild-v3.js"]').first().getAttribute('src').catch(()=>null);
                  if(live?.includes(requiredVersion)){current=true;break;}
                  if(attempt!==19)await nap(10000);
                }
                assert.ok(current,'Cloudflare has not published latest membership version '+requiredVersion);
                assert.equal(status,200);
                await page.locator('#planCards .plan-card').first().waitFor({timeout:12000});
                await page.waitForTimeout(1000);

                const base=await page.evaluate(()=>{
                  const sections=[...document.querySelectorAll('main > section')];
                  const text=document.querySelector('#plans')?.textContent||'';
                  return {
                    count:sections.length,
                    names:sections.map(x=>x.id||x.className),
                    overflows:document.documentElement.scrollWidth>innerWidth+2,
                    hero:document.querySelector('.member-hero h1')?.textContent?.includes('미리 준비하면 달라집니다.'),
                    value:document.querySelector('#membership-point')?.textContent?.includes('200P'),
                    worked:document.querySelector('#member-example')?.textContent?.includes('누적 지출 $1,600'),
                    receipt:document.querySelector('#member-proof')?.textContent?.includes('$3,887.35'),
                    photos:document.querySelectorAll('.member-photo-rail img').length,
                    plans:document.querySelectorAll('#planCards .plan-card').length,
                    form:document.querySelector('#membershipInquiryForm')?.getAttribute('action'),
                    privacy:!!document.querySelector('#membershipPrivacyInput'),
                    unwanted:[...['가입 전에 조건부터 확인하고 싶다면','약정 없음','위약금 없음','14일 이내 환불','크루즈 외 호텔·투어도','가입 전 확인']].filter(x=>document.body.innerText.includes(x)),
                    legacyScripts:document.querySelectorAll('script[src*="membership-section"],script[src*="membership-scaffold"]').length,
                    protectedForm:document.querySelector('#membershipInquiryForm')?.dataset?.securityHardened==='true',
                    initialCost:document.querySelector('#coverageRatio')?.textContent,
                    initialDifference:document.querySelector('#memberSavings')?.textContent
                  };
                });
                console.log('MEMBERSHIP_V2_AUDIT '+JSON.stringify({width,status,...base,errors}));
                assert.equal(base.count,8);
                assert.equal(base.overflows,false);
                assert.equal(base.hero,true);
                assert.equal(base.value,true);
                assert.equal(base.worked,true);
                assert.equal(base.receipt,true);
                assert.equal(base.photos,5);
                assert.equal(base.plans,2);
                assert.equal(base.form,'/api/contact');
                assert.equal(base.privacy,true);
                assert.equal(base.protectedForm,true);
                assert.deepEqual(base.unwanted,[]);
                assert.equal(base.legacyScripts,0);
                assert.equal(base.initialCost,'$1,600');
                assert.equal(base.initialDifference,'$400');
                assert.equal(errors.length,0);

                await page.locator('#cruisePrice').evaluate(el=>{
                  el.value='4000';
                  el.dispatchEvent(new Event('input',{bubbles:true}));
                });
                const regular=await page.locator('#coverageRatio').innerText();
                const regularDifference=await page.locator('#memberSavings').innerText();
                assert.equal(regular,'$3,100');
                assert.equal(regularDifference,'$900');
                await page.locator('.mode-btn[data-mode="early"]').click();
                const early=await page.locator('#coverageRatio').innerText();
                assert.equal(early,'$3,100');
                await page.locator('.mode-btn[data-mode="general"]').click();

                await page.locator('#membership-point').scrollIntoViewIfNeeded();
                await page.waitForTimeout(250);
                await page.locator('#calculator').scrollIntoViewIfNeeded();
                await page.waitForTimeout(350);
                if(width<=760){
                  const hidden=await page.locator('#membershipStickyCta').evaluate(el=>getComputedStyle(el).display==='none');
                  assert.equal(hidden,true,'Floating CTA covers calculator at '+width);
                }

                await page.screenshot({path:'membership-diagnostics/'+width+'-full.png',fullPage:true,timeout:30000});
                await page.locator('#plans').screenshot({path:'membership-diagnostics/'+width+'-plans.png',timeout:25000});
                console.log('MEMBERSHIP_V2_CALC_PASS '+JSON.stringify({width,regular,regularDifference,early}));
                await page.close();
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Archive live layout screenshots
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: membership-value-first-screenshots
          path: membership-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
