name: Membership layout diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "membership/**"
      - "functions/membership/**"
      - ".github/workflows/membership-layout-diagnostics.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test membership contact throttling without sending leads
        run: |
          node --check functions/api/contact.js
          node --check membership/membership-section11-12-guide-transition-v1.js
          node --check membership/membership-section17-18-calculator-fit-v1.js
          node --check functions/membership/_middleware.js
          node scripts/test_membership_contact_cooldown.mjs
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Inspect live mobile and desktop layouts
        env:
          SITE: https://cruiseplay-dyt.pages.dev/membership/
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const { readFileSync } = require('fs');
          const expectedScript = readFileSync('membership/index.html', 'utf8')
            .match(/cruise-membership-rebuild-v3\.js\?v=([^"]+)/)?.[1];
          if (!expectedScript) throw new Error('Missing membership script version in source HTML');
          (async () => {
            const browser = await chromium.launch({ headless: true, args:['--no-sandbox'] });
            for (const width of [320, 375, 390, 1440]) {
              const context = await browser.newContext({viewport:{width,height:850},deviceScaleFactor:1});
              const page = await context.newPage();
              const errors=[];
              page.on('pageerror', err => errors.push(err.message.slice(0,240)));
              page.on('console', msg => { if(msg.type()==='error')errors.push(msg.text().slice(0,240)); });
              try {
                // A GitHub push can finish before Cloudflare publishes that commit.
                // Validate only the live release containing this commit's JS version.
                let response;
                let matchingRelease = false;
                for (let attempt=0;attempt<20;attempt++) {
                  response = await page.goto(
                    process.env.SITE+'?audit='+process.env.GITHUB_SHA+'-'+attempt,
                    {waitUntil:'domcontentloaded',timeout:55000}
                  );
                  const liveVersion = await page.evaluate(() =>
                    document.querySelector('script[src*="cruise-membership-rebuild-v3.js"]')?.getAttribute('src') || ''
                  );
                  if (liveVersion.includes('v='+expectedScript)) {
                    matchingRelease = true;
                    break;
                  }
                  if (attempt < 19) await new Promise(resolve=>setTimeout(resolve,10000));
                }
                if(!matchingRelease) throw new Error('Expected membership release not found on live site: '+expectedScript);
                await page.waitForTimeout(6500);
                await page.locator('#member-story-top').screenshot({
                  path:'membership-'+width+'-hero.png',timeout:25000
                });
                const diagnostic = await page.evaluate(() => {
                  const selectors = ['#cms-survey-v2','#member-story-top','#member-story-experience','#mx-moving-hotel','#member-story-difference',
                    '#mx-port-day','#member-story-cost','#mx-point-example','#mx-actual-cash',
                    '#calculator','#member-story-difference','#mx-member-booking-benefits','#mx-travel-expansion',
                    '#mx-membership-freedom','#plans','#planCards','#membership-terms',
                    '.membership-bottom-cta'];
                  const rect = el => {
                    if(!el)return null;
                    const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                    return {x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),
                      height:Math.round(r.height),display:s.display,opacity:s.opacity,
                      visibility:s.visibility,overflowX:s.overflowX,fontSize:s.fontSize,
                      background:s.backgroundColor};
                  };
                  const locations=Object.fromEntries(selectors.map(x=>[x,rect(document.querySelector(x))]));
                  const elems=[...document.querySelectorAll('body *')];
                  const overflow=elems.filter(e=>{
                    if(e.closest('#cms-survey-v2')) return false;
                    const s=getComputedStyle(e);
                    if(s.display==='none'||s.visibility==='hidden'||s.position==='fixed')return false;
                    const r=e.getBoundingClientRect();
                    return r.width>0&&(r.right>innerWidth+4||r.left< -4);
                  }).slice(0,25).map(e=>({tag:e.tagName,id:e.id,cls:typeof e.className==='string'?e.className.slice(0,120):'',
                    x:Math.round(e.getBoundingClientRect().x),w:Math.round(e.getBoundingClientRect().width)}));
                  return {window:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                    horizontalOverflow:document.documentElement.scrollWidth>innerWidth+2,
                    bodyChildren:document.body.children.length,sections:[...document.querySelectorAll('main section')].map(x=>x.id),
                    surveyVisible:!!document.querySelector('#cms-survey-v2')&&getComputedStyle(document.querySelector('#cms-survey-v2')).display!=='none',
                    locations,overflow,
                    membershipCards:document.querySelectorAll('#planCards .plan-card').length,
                    benefitCards:document.querySelectorAll('#mx-member-booking-benefits .mx18-benefit-card').length,
                    refundParent:document.querySelector('#mx-membership-freedom')?.parentElement?.className??null,
                    stylesheetCount:[...document.styleSheets].filter(x=>x.href?.includes('membership')).length};
                });
                const extended = await page.evaluate(() => {
                  const sections=[...document.querySelectorAll('main > section')].map((s,i)=>{
                    const r=s.getBoundingClientRect(),h=s.querySelector('h1,h2');
                    const hr=h?.getBoundingClientRect();
                    return {i:i+1,id:s.id,h:Math.round(r.height),
                      top:Math.round(r.top+scrollY),title:h?.innerText?.slice(0,60),
                      titleSize:h?getComputedStyle(h).fontSize:null,
                      titleOffscreen:!!hr&&(hr.x < -3 || hr.right>innerWidth+3)};
                  });
                  const textOverflow=[...document.querySelectorAll('main h1,main h2,main h3,main p,main strong')]
                    .filter(e=>{const s=getComputedStyle(e);
                      return s.display!=='none' && s.visibility!=='hidden' &&
                        e.getBoundingClientRect().height>0 &&
                        e.scrollWidth>e.clientWidth+4;})
                    .slice(0,25).map(e=>({tag:e.tagName,text:e.innerText?.slice(0,42),
                        cl:String(e.className).slice(0,60),scroll:e.scrollWidth,client:e.clientWidth}));
                  const brokenImages=[...document.images].filter(e=>e.complete&&e.naturalWidth===0)
                    .slice(0,12).map(e=>({src:e.getAttribute('src'),alt:e.alt}));
                  const menu=[...document.querySelectorAll('.hero-nav-track>a')].map(e=>e.getAttribute('href'));
                  const cardDims=selector=>[...document.querySelectorAll(selector)]
                    .map(e=>{const r=e.getBoundingClientRect();
                      return {w:Math.round(r.width),h:Math.round(r.height),opacity:getComputedStyle(e).opacity};});
                  return {pageHeight:document.documentElement.scrollHeight,sections,
                    firstPlanHeading:document.querySelector('#plans h2')?.innerText?.trim()?.slice(0,90),
                    reassuranceAfterPlans:document.querySelector('#planCards')?.nextElementSibling?.id==='mx-membership-freedom',
                    textOverflow,brokenImages,menuLinks:menu.length,menuUnique:new Set(menu).size,
                    prices:[...document.querySelectorAll('#price-pain .mx6-price-amount')].map(e=>e.textContent),
                    plans:cardDims('#planCards .plan-card'),
                    benefits:cardDims('#mx-member-booking-benefits .mx18-benefit-card'),
                    refunds:cardDims('#mx-membership-freedom .mxf-card'),
                    terms:cardDims('#membership-terms .mx21-term-card')};
                });
                const alignmentAudit = await page.evaluate(() => {
                  const screenCenter=innerWidth/2;
                  const rect = el => {
                    if(!el)return null;
                    const r=el.getBoundingClientRect(),st=getComputedStyle(el);
                    return {x:Math.round(r.left),w:Math.round(r.width),center:Math.round((r.left+r.right)/2),
                      delta:Math.round((r.left+r.right)/2-screenCenter),
                      textAlign:st.textAlign,display:st.display,
                      marginLeft:st.marginLeft,marginRight:st.marginRight,
                      justify:st.justifyContent,align:st.alignItems,
                      transform:st.transform,
                      opacity:st.opacity,position:st.position,
                      paddingLeft:st.paddingLeft,paddingRight:st.paddingRight};
                  };
                  const result=[...document.querySelectorAll('main > section')].map((sec,i)=>{
                    const children=[...sec.children].filter(el=>getComputedStyle(el).display!=='none');
                    const heading=sec.querySelector('h1,h2');
                    const headingWrap=heading?.parentElement;
                    const wrapper=children.find(el=>{
                      const r=el.getBoundingClientRect();
                      return r.width>75&&r.height>40&&!el.classList.contains('page-glow');
                    })||children[0]||null;
                    const blocks=[...sec.querySelectorAll('.mv2-inner,.container,.mx7-wide-inner,.mx11-inner,.mx12-inner,.mx13-inner,.mxg-inner,.mx10p-inner,.mxp-inner,.membership-v3-price-inner,.section-head,.mv2-pay,.mx8-payment-stack,.mx13-simple-list,.mx10p-price-grid,.result-grid,#planCards,.mx21-terms')]
                      .filter(el=>{const r=el.getBoundingClientRect();return r.width>60&&r.height>10})
                      .slice(0,6).map(el=>({cl:String(el.className).slice(0,85),...rect(el)}));
                    return {i:i+1,id:sec.id||sec.className,section:rect(sec),
                      wrapper:rect(wrapper),wrapperClass:wrapper?.className,
                      heading:rect(heading),headingText:heading?.innerText?.slice(0,80),
                      headingWrap:rect(headingWrap),headingWrapClass:String(headingWrap?.className||'').slice(0,100),
                      blocks};
                  });
                  return {width:innerWidth,result};
                });
                console.log('MEMBERSHIP_CENTER_AUDIT '+JSON.stringify(alignmentAudit));
                const misaligned = alignmentAudit.result.filter(item =>
                  Math.abs(item.wrapper?.delta || 0)>15 ||
                  (item.id !== 'membership-inquiry' && Math.abs(item.heading?.delta || 0)>15));
                console.log('MEMBERSHIP_CENTER_VERDICT '+JSON.stringify({
                  width,offCenter:misaligned.map(item=>({
                    id:item.id,wrapperDelta:item.wrapper?.delta,headingDelta:item.heading?.delta
                  }))
                }));
                if(misaligned.length)process.exitCode=1;

                const controls = await page.evaluate(() => {
                  const input=document.getElementById('cruisePrice');
                  const standard=document.querySelector('.mode-btn[data-mode="general"]');
                  const advance=document.querySelector('.mode-btn[data-mode="early"]');
                  const value=id=>document.getElementById(id)?.textContent.trim();
                  if(!input||!standard||!advance)return {error:'calculator controls missing'};
                  const before=input.value;
                  input.value='4000';
                  input.dispatchEvent(new Event('input',{bubbles:true}));
                  standard.click();
                  const regular={points:value('usablePoint'),card:value('cashUsd'),total:value('coverageRatio'),
                    selected:standard.getAttribute('aria-pressed')};
                  advance.click();
                  const early={points:value('usablePoint'),card:value('cashUsd'),total:value('coverageRatio'),
                    selected:advance.getAttribute('aria-pressed')};
                  input.value=before;
                  input.dispatchEvent(new Event('input',{bubbles:true}));
                  standard.click();
                  return {regular,early,
                    regularOk:regular.points==='2,000P'&&regular.card==='$2,000'&&regular.total==='$3,100'&&regular.selected==='true',
                    earlyOk:early.points==='6,000P'&&early.card==='$0'&&early.total==='$3,100'&&early.selected==='true'};
                });
                console.log('MEMBERSHIP_DEEP_AUDIT '+JSON.stringify({width,extended,controls}));
                const compact = await page.evaluate(() => {
                  const ids=[...document.querySelectorAll('main > section')].map(el => el.id || 'unnamed');
                  const expected=['member-story-top','member-story-experience','mx-moving-hotel','member-story-difference',
                    'member-story-cost','same-cruise','member-story-secret',
                    'mx-cruise-price-examples','mx-lowest-price','member-story-points',
                    'calculator','plans','membership-inquiry'];
                  const planSection=document.querySelector('#plans');
                  const removedCopy=[
                    '가입 전에 조건부터 확인하고 싶다면?',
                    '약정 없음',
                    '멤버십 위약금 없음',
                    '14일 이내 환불',
                    '크루즈 외 호텔·투어도 별도 예약',
                    '가입 전 확인',
                    '멤버십 이용 조건'
                  ];
                  const unwantedPlanCopy=removedCopy.filter(term=>planSection?.textContent.includes(term));
                  const redundantTerms=document.querySelector('#membership-terms');
                  const injectedTermsScript=document.querySelector('script[src*="membership-section21-22-terms-final-v1.js"]');
                  const plansRect=planSection?.getBoundingClientRect();
                  const inquiryRect=document.querySelector('#membership-inquiry')?.getBoundingClientRect();
                  const receipt=document.querySelector('#same-cruise .mx8-cash-recap');
                  const secret=document.querySelector('#member-story-secret');
                  const points=document.querySelector('#member-story-points');
                  const secretText=secret?.innerText||'';
                  const pointsText=points?.innerText||'';
                  const memberMechanicsCorrect=!!secret && !!points &&
                    secretText.includes('여행비를 준비하는 방법입니다.') &&
                    secretText.includes('이것이 크루즈 멤버십') &&
                    secretText.includes('현금처럼 출금하는 돈이 아닙니다.') &&
                    pointsText.includes('$100') && pointsText.includes('200P') &&
                    pointsText.includes('$200 → 350P') && pointsText.includes('$500 → 800P') &&
                    pointsText.includes('$250 → 500P') &&
                    secret.compareDocumentPosition(points)===4;
                  const oldMemberInjectors=document.querySelectorAll(
                    'script[src*="membership-section9-10-cost-use-v1.js"],script[src*="membership-section13-14-points-v1.js"]'
                  ).length;
                  const example=document.querySelector('#member-story-cost');
                  const exampleText=example?.innerText||'';
                  const storyIds=['member-story-top','member-story-experience','mx-moving-hotel','member-story-difference'];
                  const storyCopy=storyIds.map(id=>document.getElementById(id)?.innerText||'');
                  const storyOrderCorrect=storyIds.every((id,i)=>ids[i]===id);
                  const storyWithoutSale=storyCopy.every(t=>!/(멤버십|가입비|매월 \$|14일 이내 환불)/.test(t));
                  const storyContrast=storyCopy[3]?.includes('예약비를 결제합니다.')&&storyCopy[3]?.includes('포인트도 모읍니다.');
                  return {sectionCount:ids.length,expectedCount:expected.length,
                    actualIds:ids,missing:expected.filter(id=>!ids.includes(id)),
                    extra:ids.filter(id=>!expected.includes(id)),
                    cashRecap:receipt?.textContent?.includes('$3,020.88')||false,
                    exampleComplete:['$2,000','$1,600','$400','350P','800P','1,150P','1,000P','$1,000'].every(v=>exampleText.includes(v)),
                    independentStoryOwner:!!example && example.classList.contains('member-story-savings') &&
                      getComputedStyle(example).backgroundColor==='rgb(255, 255, 255)' &&
                      !document.querySelector('#mx-direct-booking-intro'),
                    exampleCostHonest:exampleText.includes('첫 결제·월 납부 누적 $600')&&exampleText.includes('모든 예약에서 $400을 할인받는다는 뜻이 아닙니다.'),
                    bookingTotalVerified:document.querySelector('#same-cruise .mx8-real-total')?.textContent?.includes('$3,887.35')||false,
                    storyOrderCorrect,storyWithoutSale,storyContrast,
                    memberMechanicsCorrect,oldMemberInjectors,
                    planCopyRemoved:unwantedPlanCopy.length===0 &&
                      !document.querySelector('#plans .membership-plan-notice, #plans .member-plan-consult') &&
                      !redundantTerms && !injectedTermsScript,
                    unwantedPlanCopy,
                    redundantTermsPresent:!!redundantTerms,
                    termsInjectorPresent:!!injectedTermsScript,
                    planToInquiryGap:plansRect&&inquiryRect?Math.round(inquiryRect.top-plansRect.bottom):null,
                    planChoicesFirst:document.querySelector('#plans .membership-section-head')?.compareDocumentPosition(document.querySelector('#planCards'))===4};
                });
                console.log('MEMBERSHIP_COMPACT_AUDIT '+JSON.stringify({width,compact}));
                if(!compact.memberMechanicsCorrect || compact.oldMemberInjectors!==0 ||
                    !compact.independentStoryOwner || !compact.exampleComplete || !compact.exampleCostHonest || !compact.bookingTotalVerified ||
                    !compact.storyOrderCorrect || !compact.storyWithoutSale || !compact.storyContrast ||
                    !compact.planCopyRemoved || !compact.planChoicesFirst ||
                    compact.planToInquiryGap===null || Math.abs(compact.planToInquiryGap)>4)
                  process.exitCode=1;
                const conversion = await page.evaluate(() => ({
                  hero:document.querySelector('#member-story-top h1')?.textContent?.includes('비싸서 포기하셨나요?') || false,
                  price:document.querySelector('#member-story-difference')?.textContent?.includes('여행비 준비까지 같을 필요는 없습니다.') || false,
                  inquiry:!!document.querySelector('#membershipInquiryForm'),
                  privacy:!!document.querySelector('#membershipPrivacyInput'),
                  sticky:!!document.querySelector('#membershipStickyCta'),
                  oldSticky:!!document.querySelector('.membership-bottom-cta'),
                  formCentered:getComputedStyle(document.querySelector('.member-inquiry-wrap')).flexDirection==='column',
                  planLabels:[...document.querySelectorAll('#planCards .plan-cta')].map(el=>el.textContent.trim()),
                  pointCostVisible:getComputedStyle(document.querySelector('#pointKrw')).display!=='none',
                  krwTotalVisible:getComputedStyle(document.querySelector('#coverageText')).display!=='none'
                }));
                console.log('MEMBERSHIP_CONVERSION_AUDIT '+JSON.stringify({width,conversion}));
                const heroDetail=await page.evaluate(() => {
                  const shell=document.querySelector('#member-story-top');
                  const box=shell?.getBoundingClientRect();
                  const cta=document.querySelector('#member-story-top .member-story-button');
                  return {
                    height:Math.round(box?.height||0),
                    removedCollage:!document.querySelector('.hero-visual-stage,.hero-ticket,.hero-shot'),
                    ctaTarget:cta?.getAttribute('href'),
                    title:document.querySelector('#member-story-top h1')?.textContent?.trim()||''
                  };
                });
                console.log('MEMBERSHIP_HERO_DETAIL_AUDIT '+JSON.stringify({width,heroDetail}));
                if(!heroDetail.removedCollage || heroDetail.ctaTarget!=='#member-story-experience' ||
                   heroDetail.height > (width < 720 ? 780 : 900) ||
                   heroDetail.height < 380 ||
                   !heroDetail.title.includes('비싸서 포기하셨나요?'))process.exitCode=1;
                for(const img of await page.locator('#member-story-experience img, #mx-moving-hotel img').all()) {
                  await img.scrollIntoViewIfNeeded({timeout:8000});
                  await img.evaluate(el=>el.decode());
                }
                const gallery = await page.evaluate(() => {
                  const images=[...document.querySelectorAll('#member-story-experience img, #mx-moving-hotel img')];
                  return {
                    count:images.length,
                    lazyImages:images.filter(x=>x.getAttribute('loading')==='lazy').length,
                    asyncDecoded:images.filter(x=>x.getAttribute('decoding')==='async').length,
                    altComplete:images.every(x=>!!x.alt.trim()),
                    loaded:images.every(x=>x.complete && x.naturalWidth>0),
                    heading:document.querySelector('#member-story-experience h2')?.textContent?.trim()
                  };
                });
                console.log('MEMBERSHIP_GALLERY_AUDIT '+JSON.stringify({width,gallery}));
                if(gallery.count!==2 || gallery.lazyImages!==2 || gallery.asyncDecoded!==2 ||
                   !gallery.altComplete || !gallery.loaded ||
                   !gallery.heading?.includes('꿈꿔봤던'))process.exitCode=1;
                if (!conversion.hero || !conversion.price || !conversion.inquiry ||
                    !conversion.privacy || !conversion.sticky || conversion.oldSticky ||
                    !conversion.formCentered || !conversion.pointCostVisible ||
                    !conversion.krwTotalVisible || conversion.planLabels.length!==2 ||
                    conversion.planLabels.some(text=>!text.includes('상담받기')) ||
                    !controls.regularOk || !controls.earlyOk) process.exitCode=1;

                if (width < 720) {
                  for (const protectedId of ['member-story-top', 'member-story-cost', 'same-cruise', 'calculator', 'plans', 'membership-inquiry']) {
                    await page.locator('#'+protectedId).scrollIntoViewIfNeeded({timeout:5000});
                    await page.waitForTimeout(230);
                    const stickyHidden = await page.locator('#membershipStickyCta').evaluate(el =>
                      getComputedStyle(el).display==='none'
                    );
                    console.log('MEMBERSHIP_STICKY_AUDIT '+JSON.stringify({width,protectedId,stickyHidden}));
                    if (!stickyHidden) process.exitCode=1;
                  }
                }

                const trust = await page.evaluate(() => {
                  const form=document.querySelector('#membershipInquiryForm');
                  const guard=document.querySelector('script[src*="security-guard.js"]');
                  return {
                    formHardened:form?.dataset.securityHardened==='true',
                    honeypot:!!form?.querySelector('[data-security-honeypot]'),
                    timestamp:!!form?.querySelector('[name="form_started_at"]')?.value,
                    membershipGuardVersion:guard?.src?.includes('20261117-membership-trust1')||false,
                    rejectsUnsafeLinks:typeof safeSignupUrl==='function' &&
                      safeSignupUrl('javascript:alert(1)')==='' &&
                      safeSignupUrl('data:text/html,hello')==='' &&
                      safeSignupUrl('https://user:pass@example.com/')==='' &&
                      safeSignupUrl('https://example.com/').startsWith('https://')
                  };
                });
                console.log('MEMBERSHIP_TRUST_AUDIT '+JSON.stringify({width,trust}));
                if(Object.values(trust).some(v=>v!==true))process.exitCode=1;

                const surveyScript = await page.locator('script[src*="membership-entry-survey-v2.js"]').first().getAttribute('src').catch(() => null);
                if(!surveyScript?.includes('20261117-trust1'))process.exitCode=1;
                const liveScriptText = await page.evaluate(async () => {
                  const script = document.querySelector('script[src*="membership-entry-survey-v2.js"]');
                  if (!script) return '';
                  try { return await (await fetch(script.src, {cache:'no-store'})).text(); } catch(e) { return ''; }
                });
                const cssBundle = await page.evaluate(async () => {
                  const el=document.querySelector('link[href*="membership-unified.css"]');
                  const url=el?.href||null;
                  if(!url)return {url:null};
                  try {
                    const resp=await fetch(url,{cache:'no-store'});
                    const code=await resp.text();
                    return {url,status:resp.status,length:code.length,
                      canonicalOwnerPresent:code.includes('06 — PRICE BRIDGE: canonical responsive styles'),
                      previousOwnerPresent:code.includes('06 — PRICE BRIDGE */')};
                  } catch(e) {return {url,error:String(e)};}
                });
                const priceLayout = await page.evaluate(() => {
                  const section=document.querySelector('#member-story-difference');
                  if(!section) return null;
                  const inner=section.querySelector('.member-story-frame'),title=section.querySelector('h2');
                  const amount=section.querySelector('.member-story-methods'),description=section.querySelector('.member-story-next');
                  const sectionRect=section.getBoundingClientRect();
                  const measure=(el)=>{
                    if(!el)return null;
                    const box=el.getBoundingClientRect(),style=getComputedStyle(el);
                    return {x:Math.round(box.x),y:Math.round(box.y),
                      w:Math.round(box.width),h:Math.round(box.height),
                      font:style.fontSize,align:style.textAlign,
                      scrollW:el.scrollWidth,clientW:el.clientWidth,
                      overflow:el.scrollWidth>el.clientWidth+2,
                      insideViewport:box.left>=-2&&box.right<=innerWidth+2};
                  };
                  return {section:measure(section),inner:measure(inner),
                    title:measure(title),amount:measure(amount),description:measure(description),
                    topPadding:getComputedStyle(section).paddingTop,
                    bottomPadding:getComputedStyle(section).paddingBottom,
                    minHeight:getComputedStyle(section).minHeight,
                    childContentHeight:description?.getBoundingClientRect().bottom-title?.getBoundingClientRect().top,
                    styleTagPresent:!!document.getElementById('membership-stage-1-4-style')};
                });
                console.log('MEMBERSHIP_LAYOUT_DIAGNOSTIC '+JSON.stringify({width,httpStatus:response.status(),errors,
                  liveScript:surveyScript,liveCodeUpdated:liveScriptText.includes("window.location.hash !== '#survey'"),
                  cssBundle,priceLayout,diagnostic}));
                if(await page.locator('#member-story-difference').count()){
                  await page.locator('#member-story-difference').scrollIntoViewIfNeeded({timeout:5000});
                  await page.waitForTimeout(300);
                  const priceImage=await page.locator('#member-story-difference').screenshot({type:'jpeg',quality:68,
                    path:'membership-'+width+'-price.jpg',timeout:25000});
                  if(width===390||width===1440)
                    console.log('MEMBERSHIP_PRICE_IMAGE_'+width+' '+priceImage.toString('base64'));
                }
                if(width===390||width===1440){
                  await page.screenshot({path:'membership-'+width+'-top.png',timeout:25000});
                  if(width===390) {
                    const jpeg = await page.screenshot({type:'jpeg',quality:48,timeout:25000});
                    console.log('MEMBERSHIP_IMAGE_390_TOP '+jpeg.toString('base64'));
                  }
                  for(const [label,selector] of [['savings','#member-story-cost'],['receipt','#same-cruise'],['secret','#member-story-secret'],['point','#member-story-points'],['calculator','#calculator'],['plans','#planCards'],['terms','#membership-terms']]){
                    const el=page.locator(selector).first();
                    if(await el.count()) {
                      await el.scrollIntoViewIfNeeded({timeout:5000}).catch(()=>{});
                      await page.waitForTimeout(350);
                      await page.screenshot({path:'membership-'+width+'-'+label+'.png',timeout:25000}).catch(()=>{});
                      if(width===390) {
                        const jpg=await el.screenshot({type:'jpeg',quality:50,timeout:25000});
                        console.log('MEMBERSHIP_IMAGE_390_'+label.toUpperCase()+' '+jpg.toString('base64'));
                      }
                    }
                  }
                }
                if(width===390){
                  await page.evaluate(() => { location.hash='#survey'; });
                  await page.locator('#cms-survey-v2 .cms2-option').first().waitFor({timeout:8000});
                  await page.locator('#cms-survey-v2 .cms2-option').first().click();
                  await page.locator('#cms-survey-v2 .cms2-option').first().click();
                  const surveyContent=await page.locator('#cms-survey-v2').innerText();
                  const hasUnsupportedPrices=/400\s*→\s*240만원|160만원 차이/.test(surveyContent);
                  await page.locator('#cms-survey-v2 .cms2-primary').click();
                  await page.locator('#cms-survey-v2').waitFor({state:'detached',timeout:5000});
                  await page.waitForTimeout(1100);
                  const calculatorLanding = await page.locator('#calculator').evaluate(el =>
                    Math.round(el.getBoundingClientRect().top)
                  );
                  const surveyReachedCalculator = calculatorLanding >= -25 && calculatorLanding <= 160;
                  console.log('MEMBERSHIP_SURVEY_SCROLL_AUDIT '+JSON.stringify({
                    width,calculatorLanding,surveyReachedCalculator
                  }));
                  if(!surveyReachedCalculator)process.exitCode=1;
                  await page.evaluate(() => { location.hash='#survey'; });
                  await page.locator('#cms-survey-v2 .cms2-close').waitFor({timeout:8000});
                  await page.locator('#cms-survey-v2 .cms2-close').click();
                  await page.locator('#cms-survey-v2').waitFor({state:'detached',timeout:5000});
                  console.log('MEMBERSHIP_SURVEY_AUDIT '+JSON.stringify({width,
                    hasUnsupportedPrices,dismissible:true,completed:true}));
                  if(hasUnsupportedPrices)process.exitCode=1;
                }
              } catch(e) {
                console.log('MEMBERSHIP_LAYOUT_ERROR '+JSON.stringify({width,error:String(e),errors}));
                process.exitCode=1;
              }
              await context.close();
            }
            await browser.close();
          })().catch(err => {console.error(err);process.exitCode=1});
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-layout-screenshots
          path: membership-*.png
          if-no-files-found: ignore
