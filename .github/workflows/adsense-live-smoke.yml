name: AdSense production smoke check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adsense-live-smoke.yml
      - index.html
      - tools/**
      - editorial-policy/**
      - assets/css/route-comparison.css
      - functions/_middleware.js
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check published HTML and functional pages
        shell: bash
        run: |
          python - <<'PY'
          import time, urllib.request, urllib.error
          checks = {
            'https://cruiseplay-dyt.pages.dev/': '바다를 볼 수 있는 창이 있는 객실',
            'https://cruiseplay-dyt.pages.dev/tools/trip-budget/': '크루즈 여행비',
            'https://cruiseplay-dyt.pages.dev/editorial-policy/': '콘텐츠는 이렇게',
            'https://cruiseplay-dyt.pages.dev/blog/cruise-gratuities-service-charge-guide/': 'MSC 공식 서비스 차지'
          }
          remaining = dict(checks)
          for attempt in range(1, 7):
            print(f'Production attempt {attempt}/6; remaining: {len(remaining)}', flush=True)
            for url, needle in list(remaining.items()):
              try:
                request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; AdSenseProductionCheck/1.0)'})
                with urllib.request.urlopen(request, timeout=12) as r:
                  html = r.read().decode('utf-8', 'replace')
                  status = r.status
                  mime = r.headers.get('content-type', '')
                good = status == 200 and 'text/html' in mime and needle in html
                print(f'{status} {url} mime={mime} expected_present={needle in html} result={"OK" if good else "WAIT"}', flush=True)
                if good: remaining.pop(url)
              except Exception as exc:
                print(f'WAIT {url} {type(exc).__name__}: {str(exc)[:150]}', flush=True)
            if not remaining: break
            if attempt < 6: time.sleep(24)
          if remaining:
            print('ERROR: not publicly served as expected: ' + ', '.join(remaining), flush=True)
            raise SystemExit(1)
          print('OK: all published pages have expected content', flush=True)
          PY
