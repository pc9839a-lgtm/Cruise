name: Final cruise publication validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-cruise-publication-check.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository and live deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request, xml.etree.ElementTree as ET

          base = 'https://cruiseplay-dyt.pages.dev'
          slug = 'cruise-terminal-arrival-time-checkin-guide'
          url = f'{base}/blog/{slug}/'
          root = pathlib.Path('.')

          posts = json.loads((root/'content/blog-meta.json').read_text(encoding='utf-8'))['posts']
          index = (root/'blog/index.html').read_text(encoding='utf-8')
          article = (root/f'blog/{slug}/index.html').read_text(encoding='utf-8')
          sitemap = (root/'sitemap.xml').read_text(encoding='utf-8')
          robots = (root/'robots.txt').read_text(encoding='utf-8')

          assert len(posts) == 60
          assert index.count('class="blog-card"') == 60
          assert index.count(f'href="/blog/{slug}/"') >= 1
          assert 'fetch(' not in index
          assert '/partner/' not in sitemap
          assert url in sitemap
          assert 'Disallow: /partner/' in robots
          assert f'Sitemap: {base}/sitemap.xml' in robots
          assert article.count('rel="canonical"') == 1
          assert article.count('name="robots"') == 1
          assert '"@type":"BlogPosting"' in article
          assert '크루즈플레이 편집팀' in article
          assert sum(p.get('published_at') == '2026-07-27' for p in posts) == 1

          def fetch(path):
              req = urllib.request.Request(base + path, headers={'User-Agent':'CruisePlay-Final-Validator/1.0'})
              with urllib.request.urlopen(req, timeout=30) as res:
                  body = res.read()
                  assert res.status == 200, (path, res.status)
                  return body

          live_article = fetch(f'/blog/{slug}/')
          live_blog = fetch('/blog/')
          live_sitemap = fetch('/sitemap.xml')
          live_rss = fetch('/rss.xml')
          live_feed = fetch('/feed.xml')
          for internal in [
              '/blog/pre-cruise-flight-hotel-arrival-guide/',
              '/blog/cruise-booking-name-passport-match-guide/',
              '/blog/cruise-luggage-guide/',
              '/blog/cruise-boarding-process/'
          ]:
              fetch(internal)

          assert live_article.count(b'rel="canonical"') == 1
          assert '크루즈 터미널에는 몇 시에 도착해야 할까?'.encode() in live_article
          assert live_blog.count(b'class="blog-card"') == 60
          assert f'href="/blog/{slug}/"'.encode() in live_blog
          assert b'fetch(' not in live_blog
          assert url.encode() in live_sitemap
          assert b'/partner/' not in live_sitemap
          assert live_rss.count(b'<item>') == 20
          assert live_feed.count(b'<item>') == 20
          assert url.encode() in live_rss and url.encode() in live_feed
          ET.fromstring(live_sitemap)
          ET.fromstring(live_rss)
          ET.fromstring(live_feed)
          print('FINAL_VALIDATION_OK repository_posts=60 live_cards=60 live_urls=9 rss_items=20 feed_items=20')
          PY
      - name: Remove one-time validator
        shell: bash
        run: |
          rm -f .github/workflows/final-cruise-publication-check.yml
          git config user.name 'cruiseplay-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/final-cruise-publication-check.yml
          git commit -m 'Validate cruise publication: 60 static cards and live URLs OK'
          git pull --rebase origin main
          git push origin HEAD:main
