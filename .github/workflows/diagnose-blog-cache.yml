name: Diagnose blog cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-blog-cache.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare canonical and cache-busted blog HTML
        shell: bash
        run: |
          set -u
          base='https://cruiseplay-dyt.pages.dev/blog/'
          code1=$(curl -L -sS --max-time 25 -D /tmp/h1 -o /tmp/b1 -w '%{http_code}' -A 'CruisePlay-Cache-Diagnostic/1.0' "$base" || true)
          code2=$(curl -L -sS --max-time 25 -D /tmp/h2 -o /tmp/b2 -w '%{http_code}' -A 'CruisePlay-Cache-Diagnostic/1.0' "${base}?v=20260727-static60" || true)
          cards1=$(grep -o 'class="blog-card"' /tmp/b1 2>/dev/null | wc -l | tr -d ' ')
          cards2=$(grep -o 'class="blog-card"' /tmp/b2 2>/dev/null | wc -l | tr -d ' ')
          fetch1=0; fetch2=0
          grep -Fq "fetch('/content/blog-meta.json" /tmp/b1 2>/dev/null && fetch1=1
          grep -Fq "fetch('/content/blog-meta.json" /tmp/b2 2>/dev/null && fetch2=1
          cache1=$(awk 'BEGIN{IGNORECASE=1}/^cf-cache-status:/{gsub("\r","");print $2}' /tmp/h1 | tail -1); [ -n "$cache1" ] || cache1='NONE'
          cache2=$(awk 'BEGIN{IGNORECASE=1}/^cf-cache-status:/{gsub("\r","");print $2}' /tmp/h2 | tail -1); [ -n "$cache2" ] || cache2='NONE'
          age1=$(awk 'BEGIN{IGNORECASE=1}/^age:/{gsub("\r","");print $2}' /tmp/h1 | tail -1); [ -n "$age1" ] || age1='0'
          age2=$(awk 'BEGIN{IGNORECASE=1}/^age:/{gsub("\r","");print $2}' /tmp/h2 | tail -1); [ -n "$age2" ] || age2='0'
          rm -f .github/workflows/diagnose-blog-cache.yml
          git config user.name 'cruiseplay-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/diagnose-blog-cache.yml
          git commit -m "Blog cache check base=${code1}:${cards1}:fetch${fetch1}:${cache1}:age${age1} bust=${code2}:${cards2}:fetch${fetch2}:${cache2}:age${age2}"
          git pull --rebase origin main
          git push origin HEAD:main
