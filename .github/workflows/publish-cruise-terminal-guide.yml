          assert len(urls) == len(set(urls)), 'duplicate sitemap URL'
          assert f'{domain}/blog/{slug}/' in urls, 'new URL missing in sitemap'
          assert not any('/partner/' in url for url in urls), 'partner URL in sitemap'
          index_root = ET.parse('sitemap-google.xml').getroot()
          assert index_root.findtext('sm:sitemap/sm:loc', namespaces=ns) == f'{domain}/sitemap.xml'
          for feed in ('rss.xml', 'feed.xml'):
              root = ET.parse(feed).getroot()
              assert root.tag == 'rss'
              assert len(root.findall('./channel/item')) == 20
          print('XML_VALIDATION_OK')
          PY

          rm -f .github/workflows/publish-cruise-terminal-guide.yml
          git config user.name "cruiseplay-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog-meta.json blog/index.html blog/cruise-terminal-arrival-time-checkin-guide/index.html sitemap.xml sitemap-google.xml rss.xml feed.xml .github/workflows/publish-cruise-terminal-guide.yml
          git commit -m "Publish cruise terminal arrival guide"
          git pull --rebase origin main
          git push origin HEAD:main
