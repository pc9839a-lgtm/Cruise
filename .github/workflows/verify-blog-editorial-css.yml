name: Verify cruise blog editorial CSS
on:
  push:
    branches: [main]
    paths:
      - blog/index.html
      - assets/css/blog-journal-20261022.css
      - .github/workflows/verify-blog-editorial-css.yml
  pull_request:
    paths:
      - blog/index.html
      - assets/css/blog-journal-20261022.css
      - .github/workflows/verify-blog-editorial-css.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prevent unversioned editorial markup/style mismatch
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('blog/index.html').read_text(encoding='utf-8')
          css=Path('assets/css/blog-journal-20261022.css').read_text(encoding='utf-8')
          markers=['editorial-intro-main','editorial-intro-side','editorial-intro-bottom','editorial-section-heading','blogGrid']
          assert all(m in html for m in markers), 'Missing editorial markup'
          assert 'href="/assets/css/blog-journal-20261022.css"' in html, 'Editorial stylesheet not referenced'
          assert html.index('href="/assets/css/blog.css?v=') < html.index('href="/assets/css/blog-journal-20261022.css"'), 'Wrong CSS load order'
          assert all(m in css for m in ['.editorial-intro-main{display:grid', '#blogGrid .blog-card:first-child{grid-column:span 2}', '@media(max-width:600px)']), 'Editorial styles missing'
          assert css.count('{')==css.count('}'), 'CSS braces mismatch'
          print('PASS: editorial markup and versioned CSS are paired')
          PY
      - name: Confirm public HTML and editorial stylesheet after Cloudflare deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import time, urllib.request
          root='https://cruiseplay-dyt.pages.dev'
          pages={
            root+'/blog/':('text/html','/assets/css/blog-journal-20261022.css','editorial-intro-main'),
            root+'/assets/css/blog-journal-20261022.css':('text/css','.editorial-intro-main{display:grid','#blogGrid .blog-card:first-child{grid-column:span 2}')
          }
          pending=dict(pages)
          for attempt in range(1,11):
            for url,(mime,fragment1,fragment2) in list(pending.items()):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req, timeout=15) as response:
                  body=response.read(200000).decode('utf-8','replace')
                  valid=response.status==200 and mime in response.headers.get('Content-Type','').lower() and fragment1 in body and fragment2 in body
                print(attempt,url,'ok',valid,flush=True)
                if valid:pending.pop(url)
              except Exception as error:print('WAIT',url,str(error)[:140],flush=True)
            if not pending:break
            if attempt<10:time.sleep(16)
          if pending:raise SystemExit('Editorial CSS not fully deployed: '+str(list(pending)))
          print('PASS: live blog HTML and new CSS are synchronized',flush=True)
          PY
