name: Publish one cruise lost-item guide
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cruise-lost-found.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate and validate one article
        shell: bash
        run: |
          cat > /tmp/publish.mjs <<'NODE'
          import fs from 'node:fs';
          const date='2026-07-26';
          const slug='cruise-lost-found-item-report-guide';
          const title='크루즈에서 물건을 잃어버렸다면? 선내 분실물·하선 후 신고 가이드';
          const summary='크루즈 선내에서 휴대전화·여권·가방을 잃어버렸을 때 즉시 확인할 장소, Guest Services 신고 정보, 하선 후 온라인 접수와 국제 배송비 주의사항을 정리했습니다.';
          const image='https://images.unsplash.com/photo-1521791055366-0d553872125f?q=80&w=1600&auto=format&fit=crop';
          const url=`https://cruiseplay-dyt.pages.dev/blog/${slug}/`;
          const metaPath='content/blog-meta.json';
          const blogPath='blog/index.html';
          const sitemapPath='sitemap.xml';
          const rssPaths=['rss.xml','feed.xml'];
          for(const p of [metaPath,blogPath,sitemapPath,'sitemap-google.xml','robots.txt','assets/js/blog-index.js',...rssPaths]) if(!fs.existsSync(p)) throw new Error(`missing ${p}`);
          const meta=JSON.parse(fs.readFileSync(metaPath,'utf8'));
          if(meta.posts.some(p=>p.slug===slug)) throw new Error('slug already exists');
          if(meta.posts.some(p=>p.published_at===date)) throw new Error('an article is already dated today');
          const oldCount=meta.posts.length;
          meta.posts.unshift({slug,category:'여행팁',title,summary,thumbnail_url:image,tag_text:'크루즈분실물,선내분실,GuestServices,하선후신고',published_at:date,updated_at:date,sort_order:Math.min(...meta.posts.map(p=>Number(p.sort_order)||0))-1});
          fs.writeFileSync(metaPath,JSON.stringify(meta,null,2)+'\n');
          const article=`<!doctype html>
          <html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>${title} | 크루즈플레이</title>
          <meta name="description" content="${summary}"><meta name="robots" content="index,follow,max-image-preview:large">
          <link rel="canonical" href="${url}"><meta property="og:type" content="article"><meta property="og:title" content="${title}"><meta property="og:description" content="${summary}"><meta property="og:url" content="${url}"><meta property="og:image" content="${image}">
          <link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/blog.css">
          <script type="application/ld+json">${JSON.stringify({'@context':'https://schema.org','@type':'BlogPosting',headline:title,description:summary,image:[image],datePublished:date,dateModified:date,author:{'@type':'Organization',name:'크루즈플레이 편집팀'},publisher:{'@type':'Organization',name:'크루즈플레이'},mainEntityOfPage:{'@type':'WebPage','@id':url}})}</script></head>
          <body class="blog-page"><div class="blog-shell"><header class="blog-topbar"><div class="blog-topbar-inner"><a class="blog-brand" href="/"><strong>크루즈플레이</strong></a><nav class="blog-nav"><a href="/">홈</a><a href="/blog/">콘텐츠</a><a href="/contact/">문의하기</a></nav></div></header>
          <main class="blog-main"><article class="blog-article"><header class="article-header"><p class="article-category">여행팁</p><h1>${title}</h1><p class="article-lead">${summary}</p><p class="article-meta">작성자 크루즈플레이 편집팀 · 게시 2026년 7월 26일 · 수정 2026년 7월 26일</p><img src="${image}" alt="크루즈 여행 중 분실물 신고에 필요한 예약 정보와 연락처를 확인하는 여행자" width="1600" height="900" loading="eager" decoding="async"></header>
          <div class="article-body"><aside class="article-toc"><strong>목차</strong><ol><li><a href="#first">선내에서 발견했을 때 먼저 할 일</a></li><li><a href="#report">신고할 때 준비할 정보</a></li><li><a href="#passport">여권·휴대전화·카드별 대응</a></li><li><a href="#after">하선 후 알게 됐을 때</a></li><li><a href="#checklist">분실물 신고 체크리스트</a></li></ol></aside>
          <p>크루즈에서 물건을 잃어버리면 일반 호텔과 달리 장소가 계속 이동하고, 하선 뒤에는 선박과 승객이 서로 다른 국가에 있을 수 있습니다. 따라서 “나중에 찾아보자”보다 <strong>발견 즉시 선내 Guest Services에 기록을 남기는 것</strong>이 가장 중요합니다. 선사마다 접수 시스템과 보관·배송 조건이 다르므로 아래 순서를 기본으로 삼고, 탑승한 선사의 공식 절차를 함께 확인해야 합니다.</p>
          <h2 id="first">1. 선내에서 분실을 알아챘다면</h2><ol><li><strong>마지막 사용 장소와 시간을 좁힙니다.</strong> 객실, 식당, 극장, 수영장, 보안검색대, 기항지 셔틀 순으로 이동 동선을 적습니다.</li><li><strong>Guest Services에 바로 신고합니다.</strong> 객실 전화 또는 선내 앱으로 운영시간을 확인하고 직접 방문하는 편이 정확합니다.</li><li><strong>객실 승무원에게도 알립니다.</strong> 침구 교체나 객실 정리 과정에서 발견되는 작은 물건은 별도로 전달될 수 있습니다.</li><li><strong>공용시설 직원에게만 말하고 끝내지 않습니다.</strong> 정식 분실물 기록 번호나 접수 여부를 확인해야 교대 후에도 조회할 수 있습니다.</li></ol>
          <table><thead><tr><th>상황</th><th>우선 확인 장소</th><th>바로 할 일</th></tr></thead><tbody><tr><td>객실 카드·SeaPass 분실</td><td>Guest Services</td><td>기존 카드 정지 후 재발급 요청</td></tr><tr><td>휴대전화 분실</td><td>마지막 사용 장소·Guest Services</td><td>원격 잠금, 연락 가능한 대체번호 등록</td></tr><tr><td>여권 분실</td><td>객실 금고·Guest Services</td><td>선사 보안팀과 한국 영사기관 연락 절차 확인</td></tr><tr><td>신용카드 분실</td><td>Guest Services</td><td>카드사 앱에서 일시정지 후 발견 여부에 따라 해제·재발급</td></tr><tr><td>기항지에서 분실</td><td>현지 경찰·관광시설</td><td>선박 복귀시간을 지키며 신고서·접수번호 확보</td></tr></tbody></table>
          <h2 id="report">2. 신고할 때 준비할 정보</h2><p>“검은 가방을 잃어버렸다”만으로는 확인이 어렵습니다. 선박명, 항해 출발일, 예약번호, 객실번호, 분실 추정 일시와 장소, 브랜드·색상·크기, 흠집이나 스티커 같은 식별 특징을 정리하세요. 전자기기는 기종과 케이스 색상, 잠금화면 문구, 일련번호를 함께 제시하면 본인 확인에 도움이 됩니다. 귀중품 내부에 현금이나 카드가 있었다면 종류와 대략적인 수량도 기록하되, 공개된 장소에서 비밀번호를 말하지 않습니다.</p>
          <h2 id="passport">3. 물건 종류별로 대응이 달라집니다</h2><h3>여권</h3><p>객실 금고와 가방 안쪽을 다시 확인한 뒤 즉시 Guest Services에 알리세요. 기항지 입국이나 최종 하선에 영향을 줄 수 있으므로 일반 소지품보다 먼저 처리해야 합니다. 해외에서 재발급 또는 여행증명서가 필요하면 대한민국 외교부 영사콜센터나 관할 재외공관 안내를 따릅니다. 선박 일정과 다음 기항지에 따라 가능한 조치가 달라질 수 있으므로 개인 판단으로 하선하지 않습니다.</p>
          <h3>휴대전화</h3><p>아이폰의 ‘나의 찾기’, 안드로이드의 기기 찾기 기능으로 위치 확인과 잠금을 진행합니다. 선내 위성망이나 비행기 모드 때문에 위치가 즉시 갱신되지 않을 수 있습니다. 잠금화면에는 이메일이나 동행자 전화번호처럼 연락 가능한 정보만 표시하고 객실번호는 공개하지 않는 편이 안전합니다.</p>
          <h3>신용카드와 현금</h3><p>카드는 먼저 앱에서 일시정지하고 사용 내역을 확인합니다. 선내 계정에 연결된 카드라면 Guest Services에서 결제수단 변경이 필요한지도 확인하세요. 현금은 소유권 확인이 어려우므로 액면과 보관 형태를 구체적으로 설명합니다.</p>
          <h2 id="after">4. 하선 후에 분실을 알게 됐다면</h2><p>선사 공식 사이트의 Post-cruise 또는 Lost &amp; Found 양식을 이용해야 합니다. 로열캐리비안은 선내 분실 시 Guest Services를 이용하고 하선 후에는 별도의 온라인 신고 링크를 제공하고 있습니다. NCL은 분실물 접수와 상태 조회 메뉴를 운영하며, 공식 안내상 표준 응답시간은 접수 후 10영업일이고 물품이 발견되면 배송비가 발생할 수 있습니다.</p><p>온라인 신고에는 선박명과 항해일을 정확히 입력하세요. 같은 이름의 선박이나 연속 항차가 있으므로 “지난주 일본 크루즈”처럼 쓰면 확인이 늦어질 수 있습니다. 해외 배송은 운임·통관·금지품목 문제로 한국까지 바로 보내지 못하는 경우가 있으므로, 발견 통보를 받으면 배송 국가, 총비용, 추적 가능 여부를 먼저 확인합니다.</p>
          <div class="article-note"><strong>주의:</strong> 선사나 대행업체를 사칭해 카드번호 또는 송금부터 요구하는 메시지를 받을 수 있습니다. 접수 상태는 선사 공식 페이지에서 확인하고, 결제 링크의 도메인과 접수번호를 대조하세요.</div>
          <h2 id="checklist">5. 분실물 신고 체크리스트</h2><ul><li>선박명·항해 출발일·예약번호·객실번호</li><li>분실 추정 날짜·시간·장소와 이동 동선</li><li>물품 브랜드·모델·색상·크기·식별 특징</li><li>사진, 영수증, 일련번호 등 소유 증빙</li><li>한국에서 받을 이메일·전화번호·배송 주소</li><li>선내 접수 담당 부서와 접수번호</li><li>하선 전 재확인 시각과 결과</li></ul>
          <h2>관련 글</h2><p><a href="/blog/cruise-passport-documents-check/">크루즈 여권·필수서류 확인 가이드</a> · <a href="/blog/cruise-onboard-payment-guide/">크루즈 선내 결제와 카드 등록 가이드</a> · <a href="/blog/cruise-mobile-app-guide/">크루즈 선사 앱 이용 가이드</a></p>
          <section class="article-sources"><h2>공식 출처</h2><ul><li><a href="https://www.royalcaribbean.com/gbr/en/faq/questions/lost-forgot-item-onboard" rel="nofollow noopener">Royal Caribbean, How do I track down a lost or left behind item?</a></li><li><a href="https://www.ncl.com/ca/en/about/contact-us" rel="nofollow noopener">Norwegian Cruise Line, Lost &amp; Found</a></li></ul><p>공식 자료 확인일: 2026년 7월 26일. 규정과 접수 경로는 변경될 수 있으므로 출항 전 또는 신고 당일 선사 공식 페이지를 다시 확인하세요.</p></section>
          </div></article></main><footer class="blog-footer"><a href="/about/">소개</a> · <a href="/editorial-policy/">편집정책</a> · <a href="/privacy/">개인정보처리방침</a> · <a href="/terms/">이용약관</a> · <a href="/contact/">문의</a></footer></div></body></html>`;
          fs.mkdirSync(`blog/${slug}`,{recursive:true}); fs.writeFileSync(`blog/${slug}/index.html`,article.replace(/^          /gm,''));
          let blog=fs.readFileSync(blogPath,'utf8');
          const card=`<article class="blog-card" data-category="여행팁"><a href="/blog/${slug}/"><img src="${image.replaceAll('&','&amp;')}" alt="크루즈에서 물건을 잃어버렸다면? 선내 분실물·하선 후 신고 가이드" width="1600" height="900" loading="eager" decoding="async" fetchpriority="high"><time>${date}</time><h2>${title}</h2><p>${summary}</p></a></article>`;
          const grid='<div class="blog-grid" id="blogGrid">'; if(!blog.includes(grid)) throw new Error('blog grid not found');
          blog=blog.replace(grid,grid+card).replace(/(<strong id="blogResultsCount">)\d+(<\/strong>개)/,`$1${oldCount+1}$2`);
          fs.writeFileSync(blogPath,blog);
          let sm=fs.readFileSync(sitemapPath,'utf8'); if(sm.includes(url)) throw new Error('sitemap duplicate');
          sm=sm.replace('</urlset>',`<url><loc>${url}</loc><lastmod>${date}</lastmod><changefreq>monthly</changefreq><priority>0.6</priority></url></urlset>`); fs.writeFileSync(sitemapPath,sm);
          const item=`<item><title>${title}</title><link>${url}</link><guid isPermaLink="true">${url}</guid><description>${summary}</description><category>여행팁</category><dc:creator>크루즈플레이 편집팀</dc:creator><pubDate>Sun, 26 Jul 2026 00:00:00 +0000</pubDate></item>`;
          for(const p of rssPaths){let x=fs.readFileSync(p,'utf8'); const items=[...x.matchAll(/<item>[\s\S]*?<\/item>/g)].map(m=>m[0]); const first=x.indexOf('<item>'); const last=x.lastIndexOf('</item>')+7; if(first<0) throw new Error(`${p} no items`); x=x.slice(0,first)+[item,...items].slice(0,20).join('')+x.slice(last); x=x.replace(/<lastBuildDate>[^<]*<\/lastBuildDate>/,`<lastBuildDate>Sun, 26 Jul 2026 00:00:00 +0000</lastBuildDate>`); fs.writeFileSync(p,x);}
          const newMeta=JSON.parse(fs.readFileSync(metaPath,'utf8')); const finalBlog=fs.readFileSync(blogPath,'utf8'); const cards=(finalBlog.match(/class="blog-card"/g)||[]).length;
          if(newMeta.posts.length!==oldCount+1||cards!==newMeta.posts.length) throw new Error(`count mismatch meta=${newMeta.posts.length} cards=${cards}`);
          for(const p of ['sitemap.xml','sitemap-google.xml']) if(fs.readFileSync(p,'utf8').includes('/partner/')) throw new Error(`partner found in ${p}`);
          const robots=fs.readFileSync('robots.txt','utf8'); if(!robots.includes('Sitemap: https://cruiseplay-dyt.pages.dev/sitemap.xml')||!robots.includes('Disallow: /partner/')) throw new Error('robots rules changed');
          const js=fs.readFileSync('assets/js/blog-index.js','utf8'); if(/fetch\s*\(\s*['"]\/content\/blog-meta\.json/.test(js)) throw new Error('blog list still generated by JSON fetch');
          for(const link of ['cruise-passport-documents-check','cruise-onboard-payment-guide','cruise-mobile-app-guide']) if(!fs.existsSync(`blog/${link}/index.html`)) throw new Error(`missing internal link ${link}`);
          fs.rmSync('.github/workflows/publish-cruise-lost-found.yml');
          console.log(JSON.stringify({oldCount,newCount:newMeta.posts.length,cards,slug,title},null,2));
          NODE
          node /tmp/publish.mjs
      - name: Commit published article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish cruise lost and found guide"
          git push origin main
