name: Blog SEO integrity
on:
  pull_request:
    paths:
      - 'blog/**'
      - 'sitemap.xml'
      - 'scripts/audit_blog_seo.py'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check blog SEO integrity
        run: python scripts/audit_blog_seo.py
