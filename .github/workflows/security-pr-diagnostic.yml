name: Temporary code scanning PR alert diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security-pr-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  security-events: read
jobs:
  check-alert-details:
    runs-on: ubuntu-latest
    steps:
      - name: Read CodeQL alert titles and paths (no source or secrets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
            'https://api.github.com/repos/pc9839a-lgtm/Cruise/code-scanning/alerts?state=open&ref=refs%2Fpull%2F36%2Fmerge&per_page=100',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                     'Accept':'application/vnd.github+json',
                     'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req, timeout=15) as resp:
            data = json.load(resp)
          for alert in data:
            rule = alert.get('rule', {})
            if rule.get('security_severity_level') not in ('high','critical'): continue
            place = (alert.get('most_recent_instance') or {}).get('location') or {}
            print('ALERT:',alert.get('number'),'rule',rule.get('id'),
                  'severity',rule.get('security_severity_level'),
                  'path',place.get('path'),'line',place.get('start_line'),
                  'first_seen',alert.get('created_at'),'ref', (alert.get('most_recent_instance') or {}).get('ref'))
            print('SUMMARY:',str(rule.get('description',''))[:180])
          print('TOTAL_ALERTS',len(data))
          PY
