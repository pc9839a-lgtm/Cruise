name: Temporary CodeQL SARIF diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security-pr-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          upload-database: false
          output: ${{ github.workspace }}/_security_sarif
      - name: Print rule and file locations of security-relevant alerts
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,os
          paths=glob.glob('_security_sarif/**/*.sarif',recursive=True)
          for path in paths:
            data=json.load(open(path))
            for run in data.get('runs',[]):
              rules={r['id']:r for r in run.get('tool',{}).get('driver',{}).get('rules',[])}
              results=run.get('results',[])
              print('SARIF',path,'all_results',len(results))
              for result in results:
                rule=rules.get(result.get('ruleId'),{})
                props=rule.get('properties') or {}
                severity=str(props.get('security-severity') or '')
                try: high=float(severity)>=7
                except ValueError: high=False
                if not high: continue
                loc=(result.get('locations') or [{}])[0].get('physicalLocation') or {}
                print('HIGH:',result.get('ruleId'),'file',(loc.get('artifactLocation') or {}).get('uri'),
                  'line',(loc.get('region') or {}).get('startLine'),'severity',severity)
                print('MESSAGE:',(result.get('message') or {}).get('text','')[:190])
          PY
